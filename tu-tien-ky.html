<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#134e4a">
<title>Tu Tiên Ký</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:light;--jade:#134e4a;--dark:#0f3d3e;--gold:#d97706;--paper:#faf8f5;--ink:#1c1917;--muted:#57534e;--line:#e7dfd2;--serif:"Noto Serif",Georgia,serif;--sans:"Be Vietnam Pro",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 20%,#264e47,#112d2b 65%,#0a2222);color:var(--ink);font:13px var(--sans)}
button{cursor:pointer;font:inherit}
button:disabled{cursor:default;opacity:.5}
button:focus-visible{outline:2px solid #d97706;outline-offset:3px}
.game{margin:auto;max-width:450px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 24px 65px #0008;position:relative}
.hero{position:relative;isolation:isolate;background:var(--jade);color:#fff9eb;overflow:hidden;padding:17px 19px 16px;border-bottom:2px solid #b27a3e}
.mountains{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.65}
.mast,.identity,.person,.aside,.section-title,.qi-label,.stat-label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mast{border-bottom:1px solid #eed7a94a;padding-bottom:12px;margin-bottom:13px}
.brand{display:flex;align-items:center;gap:9px}
h1,h2,h3,p{margin:0}
h1{font:800 clamp(17px,5vw,23px) var(--serif);letter-spacing:.075em}
.year{color:#f0d3a4;font-size:10px;text-align:right}
.person{text-align:left;justify-content:flex-start;background:none;color:inherit;border:0;padding:0;min-width:0}
.portrait{display:grid;place-items:center;width:49px;height:49px;flex:none;border:1px solid #d8ac69;border-radius:12px;background:#0c3433;font-size:26px}
.name{display:block;font:700 17px var(--serif)}
.realm,.root{display:block;font-size:10px;margin-top:3px}
.realm{color:#fff1d5}.root{color:#bde1d0}
.aside{flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.wealth{color:#d8f8ff;font-weight:700}.gem{color:#87e8ff;text-shadow:0 0 12px #40e1fb}
.life{font-size:10px;color:#f0d3a4}
.chronicle{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#c6b49a transparent;background:repeating-linear-gradient(0deg,transparent 0 27px,#8e775708 27px 28px),var(--paper);padding:16px 19px 31px}
.section-title{color:#655a49;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px}
.section-title h2{font:800 12px var(--serif);letter-spacing:.13em}
.section-title span{color:#986329}
.record{position:relative;margin-left:4px;border-left:1px solid #dacbb6;padding:0 0 12px 13px}
.record:last-child{padding-bottom:0}
.record::before{content:"";position:absolute;top:6px;left:-4px;width:7px;height:7px;border-radius:50%;background:#a56b32;box-shadow:0 0 0 3px var(--paper)}
.record h3{font:800 13px var(--serif);color:#214e45;margin-bottom:6px}
.record p{line-height:1.62;margin:0 0 5px;color:#4b443a;overflow-wrap:anywhere}
.record .good{color:#087052}.record .danger{color:#aa2626}
.record .world{padding:6px 8px;border:1px solid #cfa96c;border-radius:5px;background:#f1e6cd;color:#174b42;font-weight:700}
.record .sacred{color:#80501b;font-weight:600}
.destiny-badge{display:block;color:#fae1a6;font-size:10px;margin-top:3px}
.destiny-badge[data-grade="0"]{color:#f1eee2}
.destiny-badge[data-grade="1"]{color:#aee8c8}
.destiny-badge[data-grade="2"]{color:#acdafa}
.destiny-badge[data-grade="3"]{color:#e4caff}
.destiny-wheel{animation:reveal-destiny .22s ease-in-out infinite alternate}
.game.rolling > :not(dialog){visibility:hidden}
@keyframes reveal-destiny{from{opacity:.5;transform:translateY(2px)}to{opacity:1;transform:translateY(-2px)}}
@media(prefers-reduced-motion:reduce){.destiny-wheel{animation:none}}
.dock{display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;align-items:center;background:var(--dark);padding:0 7px;height:59px;border-top:1px solid #b28750;position:relative}
.tab{color:#e7ecdf;background:none;border:0;min-width:0;padding:5px 0;font-size:clamp(9px,2.7vw,11px)}
.tab span{display:block;font-size:19px;color:#dfb674;margin-bottom:3px;line-height:1}
.tab:hover{color:#ffdc99}
.cultivate{justify-self:center;align-self:center;transform:translateY(-8px);display:grid;align-content:center;gap:2px;width:69px;height:69px;border:2px solid #e4b56e;border-radius:50%;background:radial-gradient(circle at 50% 25%,#397d66,#155148 73%);color:#fff4cf;box-shadow:0 0 0 4px #2c624a,0 0 18px #eaa34f65;font:800 16px var(--serif);line-height:1.25}
.cultivate small{font:600 10px var(--sans)}
.cultivate:hover{filter:brightness(1.2)}
.metrics{padding:10px 17px max(12px,env(safe-area-inset-bottom));background:#f4eee4;border-top:1px solid #d5c4ae}
.qi-label{margin-bottom:5px;font-weight:700}
.qi-label b{color:#76512d;font-size:10px}
.qi-action{background:#e6dac9;color:#604a34;border:1px solid #d4c1a9;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:700;margin-left:auto}
.qi-action:not(:disabled){background:#166151;color:#fff0be;border-color:#b87b34;box-shadow:0 0 10px #d9770655}
.track{height:5px;border-radius:10px;background:#e0d5c6;overflow:hidden}
.track i{height:100%;display:block;background:var(--fill,#ac6d34);border-radius:inherit;transition:width .25s}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin-top:8px}
.stat-label{font-size:10px;font-weight:600;margin-bottom:3px}
.stat-label b{font-size:10px;color:#594d40}
dialog{position:fixed;inset:auto 0 0;margin:0 auto;width:100%;max-width:450px;max-height:88dvh;overflow:auto;background:#faf6ed;color:var(--ink);border:0;border-top:3px solid #ad7436;border-radius:17px 17px 0 0;padding:18px 19px max(19px,env(safe-area-inset-bottom));box-shadow:0 -12px 45px #0005}
dialog::backdrop{background:#091d1bd0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sheet-head h2{font:800 22px var(--serif);color:var(--jade)}
.close{border:1px solid var(--line);background:#fffaf2;border-radius:8px;width:35px;height:35px;font-size:19px}
.intro{color:var(--muted);line-height:1.65;margin-bottom:12px}
.choices{display:grid;gap:7px}
.choice{display:block;text-align:left;width:100%;border:1px solid #d9cbb6;background:#fffaf2;color:#19493f;border-radius:8px;padding:10px 12px;font-weight:700}
.choice:hover:not(:disabled){background:#e9f0e4;border-color:#779987}
.choice small{display:block;font-size:11px;color:#625748;font-weight:400;margin-top:4px;line-height:1.45}
.scroll{border:1px solid #b98a55;background:linear-gradient(90deg,#ecddc4,#fff4da 12% 88%,#ecddc4);padding:15px;border-radius:4px;margin-bottom:12px;line-height:1.65}
.scroll ul{padding-left:19px;margin:7px 0 0}
.primary{background:#134e4a;color:#fff4dc;border-color:#bb8849;text-align:center}
.primary:hover:not(:disabled){background:#236256;color:white}
.portrait svg{width:100%;height:100%}
.character-art{display:block;width:112px;height:132px;margin:0 auto 10px;border:1px solid #b8945b;border-radius:48% 48% 10px 10px;background:#123e3a}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.form-grid label{display:grid;gap:4px;font-size:11px;font-weight:700}
.form-grid input,.form-grid select{min-width:0;width:100%;border:1px solid #cfbea4;background:#fffaf2;border-radius:6px;padding:7px;color:#1c1917}
.talent-list{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;border:1px solid #cfbea4;padding:8px;border-radius:6px}
.talent-list label{display:flex;align-items:center;font-weight:500}
.talent-list input{width:auto;accent-color:#134e4a}
.form-feedback{grid-column:1/-1;color:#9c3636;font-size:11px;min-height:1em}
.affinity{margin:0 0 12px}
.work-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.work-tabs button{padding:6px 8px;border-radius:6px;border:1px solid #cbb89b;background:#fffaf2;color:#254f43;font-size:11px}
.work-tabs button[aria-current=true]{background:#134e4a;color:#fff4dc}
.choice[data-grade="0"]{border-left:4px solid #a5a096}
.choice[data-grade="1"]{border-left:4px solid #579369}
.choice[data-grade="2"]{border-left:4px solid #4d79a9}
.choice[data-grade="3"]{border-left:4px solid #8e5fac}
.choice[data-grade="4"]{border-left:4px solid #b77924}
.work-card{padding:10px;margin-bottom:9px;border:1px solid #d4c3a6;border-radius:8px;background:#f4ecdf}
.work-card summary{cursor:pointer;color:#134e4a;font-weight:700}
.resource-line{display:flex;justify-content:space-between;gap:8px;font-size:10px;font-weight:700;margin:5px 0 3px}
.combat-log{max-height:124px;overflow:auto;font-size:11px;line-height:1.6}
@media(max-height:560px){.hero{padding:9px 12px}.mast{padding-bottom:5px;margin-bottom:6px}.portrait{width:36px;height:36px;font-size:20px}.chronicle{padding-top:9px}.metrics{padding-top:6px}.dock{height:48px}.cultivate{width:57px;height:57px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="game shadow-2xl">
  <header class="hero">
    <svg class="mountains" viewBox="0 0 450 153" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle cx="357" cy="55" r="52" fill="#d4a763" opacity=".19"/>
      <path d="M0 112 39 87 63 101 109 70 154 104 190 86 215 105 270 59 297 80 344 36 372 68 397 53 450 98V153H0Z" fill="#6e9b80" opacity=".34"/>
      <path d="M0 131 58 109 95 122 156 96 195 113 245 89 271 108 316 80 348 101 403 77 450 109V153H0Z" fill="#072d2b" opacity=".72"/>
      <path d="M277 71q29-3 66 0t90-3M216 107q73-7 113 0t120-2" fill="none" stroke="#d4dfbd" opacity=".25"/>
    </svg>
    <div class="mast">
      <div class="brand">
        <svg width="27" height="27" viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="12" fill="none" stroke="#e6ba77" stroke-width="1.5"/>
          <path d="M14 2a12 12 0 0 1 0 24 6 6 0 0 1 0-12 6 6 0 0 0 0-12" fill="#e6ba77"/>
          <circle cx="14" cy="8" r="1.6" fill="#e6ba77"/><circle cx="14" cy="20" r="1.6" fill="#134e4a"/>
        </svg>
        <h1>TU TIÊN KÝ</h1>
      </div>
      <span class="year" id="year"></span>
    </div>
    <div class="identity">
      <button class="person" id="profile" aria-label="Mở bảng nhân vật Đạo Thân">
        <span class="portrait" id="portrait" aria-hidden="true"></span>
        <span><strong class="name" id="name"></strong><span class="realm" id="realm"></span><span class="root" id="root"></span></span>
      </button>
      <div class="aside"><span class="wealth"><span class="gem" aria-hidden="true">◆</span> <span id="wealth"></span></span><span class="life" id="life"></span></div>
    </div>
  </header>
  <section class="chronicle" id="chronicle" aria-labelledby="journal-title">
    <div class="section-title"><h2 id="journal-title">NHẬT KÝ TU HÀNH</h2><span aria-hidden="true">◇</span></div>
    <div id="logs" role="log" aria-live="polite"></div>
  </section>
  <nav class="dock" aria-label="Hành sự">
    <button class="tab" data-menu="profile"><span aria-hidden="true">◇</span>Nhân Vật</button>
    <button class="tab" data-menu="sect"><span aria-hidden="true">⛩</span>Tông Môn</button>
    <button class="cultivate" id="advance">+1 Năm<small>Tu Luyện</small></button>
    <button class="tab" data-menu="bonds"><span aria-hidden="true">♡</span>Nhân Mạch</button>
    <button class="tab" data-menu="fate"><span aria-hidden="true">✧</span>Thế Giới</button>
  </nav>
  <section class="metrics" aria-label="Chỉ số tu hành">
    <div class="qi-label"><button class="qi-action" style="margin-left:0" id="qi-detail">✦ Tu Vi</button><b id="qi-value"></b><button class="qi-action" id="breakthrough">Đột Phá</button></div>
    <div class="track" id="qi-track" role="progressbar" aria-label="Tu Vi"><i></i></div>
    <div class="resource-line"><span>◈ Linh Lực</span><span id="mana-value"></span></div>
    <div class="track" id="mana-track" role="progressbar" aria-label="Linh Lực" style="--fill:#527989"><i></i></div>
    <div class="stat-grid" id="stats"></div>
  </section>
  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="close" id="close" aria-label="Đóng">×</button></div>
    <div id="sheet-body"></div>
  </dialog>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const pick = values => values[Math.floor(Math.random() * values.length)];
const die = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const number = value => value.toLocaleString('vi-VN');
const minorStages = ['Sơ Kỳ', 'Trung Kỳ', 'Hậu Kỳ', 'Đại Viên Mãn'];
const realms = [
  {name:'Phàm Nhân', life:80, base:18, stages:['']},
  {name:'Luyện Khí', life:120, base:22, stages:Array.from({length:9}, (_, i) => 'Tầng ' + (i + 1))},
  {name:'Trúc Cơ', life:220, base:63, stages:minorStages},
  {name:'Kim Đan', life:400, base:90, stages:minorStages},
  {name:'Nguyên Anh', life:680, base:122, stages:minorStages},
  {name:'Hóa Thần', life:1050, base:159, stages:minorStages},
  {name:'Độ Kiếp', life:1600, base:205, stages:minorStages},
  {name:'Phi Thăng Tiên Giới', life:3000, stages:['']}
];
const attributes = [
  ['health','♥','Khí Huyết','#a63f42'], ['heart','❖','Đạo Tâm','#897440'],
  ['insight','✦','Ngộ Tính','#4a6587'], ['luck','✧','Cơ Duyên','#247863']
];
const roots = [
  ['Ngũ Hành Tạp Linh Căn', .86], ['Tam Linh Căn · Mộc Thủy Thổ', 1],
  ['Song Linh Căn · Kim Hỏa', 1.08], ['Đơn Linh Căn · Hỏa', 1.22],
  ['Biến Dị Lôi Linh Căn', 1.36], ['Biến Dị Băng Linh Căn', 1.36]
];
const talents = [
  ['Tĩnh Nhược Chỉ Thủy',{heart:12}], ['Nhất Văn Thiên Ngộ',{insight:15}],
  ['Phúc Tinh Chiếu Mệnh',{luck:14}], ['Thiết Cốt',{health:10}],
  ['Đan Hỏa Bẩm Sinh',{pills:2}], ['Thương Lộ Hữu Duyên',{stones:35}],
  ['Thiên Sinh Kiếm Tâm',{insight:7,heart:5}], ['Lôi Hỏa Bất Xâm',{ward:1}],
  ['Kiếm Tâm Thông Minh',{insight:10,attack:5}], ['Thể Chất Đan Độc',{alchemy:12,health:4}],
  ['Đào Hoa Vận',{charm:10}], ['Sát Tinh Nhập Mệnh',{attack:9,karma:-12}],
  ['Trời Sinh Thần Lực',{attack:8,health:8}], ['Mệnh Dài Như Hạc',{longevity:12}],
  ['Thiên Cơ Nhập Mộng',{luck:8,insight:5}], ['Vạn Thú Thân Hòa',{beast:1,luck:5}],
  ['Ngọc Cốt Băng Tâm',{heart:8,guard:4}], ['Linh Hải Vô Biên',{cultivation:3}]
];
const events = [
  ['Đom đóm dưới chân núi','Lũ đom đóm dẫn ngươi đến một khe đá âm ấm.',[
    ['Thò tay vào khe','Một viên linh thạch ấm như than nằm trong lòng bàn tay.',{stones:12,luck:2}],
    ['Ngồi nhìn đom đóm','Trong tĩnh lặng, ngươi nghe rõ từng nhịp thở.',{heart:7,qi:3}]],{maxAge:15}],
  ['Chiếc diều giấy','Diều của một đứa trẻ mắc trên cây tùng cạnh vách đá.',[
    ['Leo lên gỡ diều','Đứa trẻ tặng ngươi đồng tiền buộc chỉ đỏ.',{health:-5,karma:5,luck:5}],
    ['Làm chiếc diều mới','Hai đứa chơi đến lúc trăng lên.',{heart:8}]],{maxAge:15}],
  ['Ông đồ và bút mực','Ông đồ đầu làng đặt trước mặt ngươi một tờ giấy dó.',[
    ['Xin học chữ','Ngươi chép chữ “Đạo” đến khi mực thấm qua giấy.',{insight:7}],
    ['Giúp ông mài mực','Ông đồ kể chuyện tiên nhân qua đò.',{heart:6,karma:3}]],{maxAge:17}],
  ['Con hạc gãy cánh','Một con hạc trắng nép dưới máng hiên sau trận mưa.',[
    ['Băng bó cho nó','Hạc bay đi, để lại một chiếc lông bạc.',{stones:-3,luck:6,karma:6}],
    ['Mang vào nhà trú mưa','Nửa đêm, con hạc đã tự bay về đầm.',{heart:4}]],{maxAge:17}],
  ['Hạt giống của bà','Bà lão đặt một hạt sen đen vào tay ngươi.',[
    ['Gieo cạnh giếng','Giữa mùa đông, sen nở và tỏa linh khí.',{qi:9,karma:3}],
    ['Mang theo bên mình','Mỗi khi nhớ nhà, ngươi lại sờ vào chiếc túi nhỏ.',{heart:8}]],{maxAge:18}],
  ['Tiếng sáo ven hồ','Khúc sáo từ hồ vắng khiến mặt nước gợn theo từng nhịp.',[
    ['Ghi nhớ giai điệu','Ngươi tìm ra một nhịp thở mới.',{qi:8,insight:3}],
    ['Gọi người thổi sáo','Chỉ có tiếng vọng trả lời, rồi mặt hồ lặng sóng.',{heart:6}]]],
  ['Gánh thuốc qua đèo','Người bán thuốc trẹo chân giữa đường. Gió núi đã bắt đầu mạnh.',[
    ['Gánh thuốc hộ','Ông biếu ngươi một viên Hồi Xuân Đan.',{pills:1,karma:5}],
    ['Chỉ đường tắt xuống làng','Ông chống gậy đi theo đường ngươi chỉ.',{luck:2}]]],
  ['Bến đò ngập nước','Mưa nguồn cuốn mất dây neo. Một đứa trẻ còn trên đò.',[
    ['Lội xuống kéo đò','Ngươi đưa được đứa trẻ vào bờ, hai bàn tay rướm máu.',{health:-9,karma:10,luck:5}],
    ['Hô dân làng ứng cứu','Dân làng hợp sức kéo đò về bến.',{karma:4,heart:3}]]],
  ['Túi gấm bên đường','Một túi gấm nặng nằm sát rìa chợ.',[
    ['Hỏi người đánh rơi','Chủ túi tặng ngươi chút linh thạch để tạ ơn.',{stones:9,karma:7}],
    ['Giữ lấy','Túi chứa linh thạch. Đêm ấy ngươi nghe tiếng ai khóc ngoài hiên.',{stones:24,karma:-8,heart:-4}]]],
  ['Mộng qua cầu đá','Trong mộng, một người mang gương mặt ngươi chặn lối qua cầu.',[
    ['Hỏi người kia sợ điều gì','Tỉnh giấc, ngươi hiểu thêm về nỗi sợ của chính mình.',{heart:9,insight:3}],
    ['Bước thẳng qua cầu','Ngươi tỉnh dậy, đan điền còn ấm.',{qi:12,heart:-3}]]],
  ['Xuân lôi trên đỉnh núi','Sấm đầu xuân đánh ba tiếng vào một cây tùng cháy dở.',[
    ['Tọa thiền dưới tán tùng','Linh lực theo tiếng sấm nhập thể, da tay phồng rộp.',{qi:17,health:-7}],

let state;
let sheetRequired = false;
let activeMenu = '';
const saveKey = 'tu-tien-ky-v1';
const stage = () => realms[state.realm];
const title = () => [stage().name, stage().stages[state.step]].filter(Boolean).join(' · ');
const target = () => stageTarget(state.realm,state.step);
const unlocked = () => target() > 0 && state.qi >= target() && !state.pending && !state.dead;

function newLife(draft) {
  const background = weightedPick(destinyOrigins,row => row[1]);
  const root = weightedPick(destinyRoots,row => row[1]);
  const pool = [...talents,...cursedTalents];
  const gifts = Array.from({length:3},() => pool.splice(die(0,pool.length - 1),1)[0]);
  const physique = rollPhysique();
  const previous = state?.dead ? {insight:state.insight,arts:Object.keys(state.skillBook)} : null;
  const rerolled = Boolean(state && state.age === 0 && !state.dead);
  const birth = state ? state.birth + state.age + 1 : 2110;
  state = {
    name:draft.name, sex:draft.sex || pick(['Nam','Nữ']), appearance:{hair:die(0,2),robe:die(0,3),face:die(0,2)},
    birth:rerolled ? birth - 1 : birth, age:0, realm:0, step:0, qi:0, health:die(79,88), heart:die(57,71),
    insight:die(39,56), luck:die(38,59), stones:0, karma:0, pills:1, ward:0,
    manuals:0, manualLevel:0, background:background[0],
    root:root[0], aptitude:root[2], talents:gifts.map(gift => gift[0]), sect:'',
    physique,awakening:0,beauty:die(10,95),rerolled,
    contribution:0, mentor:0, bond:0, rival:0, pet:0, nextEvent:1,
    used:[], actions:{}, logs:[], achievements:[], pending:null, dead:''
  };
  upgradeSave();
  apply(background[3]);
  gifts.forEach(gift => apply(gift[1]));
  if (physique === 'samsara' && previous) {
    apply({insight:Math.floor(previous.insight * .2)});
    if (previous.arts.length) learnArt(pick(previous.arts));
  }
  seedFamily();
  note(background[2]);
  note('Thân thế: ' + state.background + '. Linh căn: ' + state.root + '.', 'good');
  note('Thiên phú: ' + state.talents.join(' · ') + '.');
  note('Thiên mệnh · ' + physiqueName() + ' · Dung Mạo ' + beauty() + ' / 100.','sacred');
}

function note(message, tone = '') {
  let group = state.logs.at(-1);
  if (!group || group.age !== state.age || group.title !== title()) {
    group = {age:state.age,title:title(),entries:[]};
    state.logs.push(group);
  }
  group.entries.push({message,tone});
}

function apply(changes) {
  for (const [key, amount] of Object.entries(changes)) {
    if (key === 'weapon') {
      for (let i = 0; i < amount; i++) makeGear('sword','Hộ Sơn Kiếm',0,1,'huyenthiet');
      continue;
    }
    state[key] += amount;
    if (key === 'health') state.health = clamp(state.health,0,maxHealth());
    else if (attributes.some(([stat]) => stat === key)) state[key] = clamp(state[key],0,100);
    else if (key === 'karma') state[key] = clamp(state[key],-100,100);
    else if (key === 'qi') state.qi = clamp(state.qi,0,target());
    else if (key === 'mana') state.mana = clamp(state.mana,0,manaMax());
    else if (key === 'toxin') state.toxin = Math.max(0,state.toxin - (amount > 0 ? Math.round(amount * body('toxin')) : 0));
    else if (key === 'beauty') state.beauty = clamp(state.beauty,0,100);
    else state[key] = Math.max(0,state[key]);
  }
}

function achievement(label) {
  if (!state.achievements.includes(label)) state.achievements.push(label);
}

function checkDeath() {
  if (state.dead) return;
  if (state.health <= 0) state.dead = 'Thân Tử Đạo Tiêu';
  else if (state.age >= lifespan()) state.dead = 'Tọa Hóa';
  if (state.dead) {
    state.pending = null;
    note(state.dead === 'Tọa Hóa' ? 'Thọ nguyên đã cạn. Ngươi khép mắt trong tiếng gió qua hiên.' :
      'Khí huyết cạn kiệt. Linh lực trong đan điền tan vào đất trời.', 'danger');
  }
}

function finish() {
  state.health = Math.min(state.health,maxHealth());
  state.mana = Math.min(state.mana,manaMax());
  checkDeath();
  if (!state.dead && !state.pending) openDueStory();
  render();
  if (state.dead || state.pending) showMandatory();
  else if (activeMenu) showMenu(activeMenu);
  else closeSheet();
}

function eligible(event) {
  const rules = event[3] || {};
  return state.age >= (rules.minAge || 0) && state.age <= (rules.maxAge ?? Infinity) &&
    state.realm >= (rules.realm || 0) && (!rules.sect || state.sect) &&
    state.bond >= (rules.bond || 0) && (!rules.old || state.age >= lifespan() * .65);
}

function resolveEvent(pending, choice, message, changes) {
  const [label,,,rules] = events[pending.index];
  const hook = rules?.hook;
  state.pending = null;
  note(label + ' — ' + message,changes.health < 0 ? 'danger' : 'good');
  apply(changes);
  if (changes.rival > 0) createNpc('rival','Người từng tranh cơ duyên',-25);
  if (label === 'Ma tu trọng thương' && choice === 1) {
    recordCause('sparedDemonicCultivator',0,20,'Vị trưởng lão ma đạo từng được cứu đem bí quyết đến trả ân.');
  }
  if (label === 'Đồng môn phản bội' && choice === 1) {
    recordCause('stoleSectTreasure',3,20,'Tin về chiến lợi phẩm tranh đoạt năm ấy quay lại trước cửa sơn môn.');
  }
  if (rules?.hook === 'relic' && choice !== 2) rewardMaterials(materialTier());
  if (label === 'Gánh thuốc qua đèo' && choice === 0) gainMaterial('linhsam');
  if (pending.index >= firstStory) {
    state.storyHistory.push({age:state.age,index:pending.index,choice});
    if (hook === 'family' && choice === 0 && !state.family) {
      state.family = state.name.split(' ')[0] + ' gia';
      achievement('Khai lập ' + state.family);
    }
    if (hook) {
      const delay = {mercy:20,market:3,relic:6,heart:4,family:8}[hook];
      state.delayed.push({due:state.age + delay,index:pending.index,choice});
      note('Duyên từ chuyện này vẫn chưa dứt.');
    }
  }
  finish();
}

function followupMenu(thread) {
  const original = events[thread.index];
  const hook = original?.[3]?.hook;
  const npc = state.npcs.find(person => person.id === thread.npc);
  const title = original ? 'Hồi sau · ' + original[0] : thread.special === 'betrayal' ? 'Sư môn truy kiếm' : 'Oan gia gặp lại';
  const key = original && storyCatalog[thread.index - firstStory][4 + thread.choice][1];
  let prompt, options;
  if (hook === 'mercy' && key !== 'steal') {
    prompt = 'Người mang ân năm xưa nhận ra ngươi. Thấy ngươi bị vây trên đèo, họ mở đường rồi đưa ra một tín vật.';
    options = [
      ['Nhận tín vật và cùng rời đi','Một lá hộ phù nằm bên trong tín vật.',{ward:1,heart:9}],
      ['Quay lại bảo vệ đoàn khách','Hai người che chở đoàn khách cho đến khi qua đèo.',{health:-8,karma:16,luck:7}],
      ['Chia lương khô rồi từ biệt','Người ấy chỉ cho ngươi một lối tắt qua núi.',{insight:5,heart:6}]
    ];
  } else if (hook === 'mercy' || thread.special) {
    prompt = (npc ? npc.name : 'Người từng bị ngươi cướp mất cơ duyên') +
      ' chặn ngươi ở đường hẹp, mang theo món nợ cũ và hai người làm chứng.';
    options = [
      ['Bồi thường 30 linh thạch','Ngươi trả món nợ trước mặt người làm chứng.',{stones:-30,karma:14,heart:7}],
      ['Đối đầu để thoát vòng vây','Ngươi thoát qua sườn dốc với nhiều vết thương.',{health:-20,qi:14,heart:-5}],
      ['Nhờ người làm chứng hòa giải','Ngươi giao lại vật tùy thân và chịu để lời thề được ghi vào sổ.',{heart:-5,karma:6}]
    ];
  } else if (hook === 'heart') {
    prompt = 'Tâm ma trở lại. ' + (key === 'lose' ? 'Linh lực ngươi từng ép xuống bắt đầu nghịch hành.' : 'Lần này ngươi nhận ra tiếng nói trước khi mộng thành hình.');
    options = [
      ['Điều tức và gọi đúng tên nỗi sợ','Cảnh mộng lùi lại theo từng nhịp thở.',{heart:key === 'lose' ? 8 : 16,insight:7}],
      ['Dùng Hộ Kiếp Phù giữ tâm mạch','Giấy bùa cháy hết, kinh mạch vẫn nguyên vẹn.',{ward:-1,heart:14,qi:12}],
      ['Dẫn tâm ma vào đan điền','Ngươi giữ được linh lực nhưng tà niệm còn sót lại.',{heart:-12,qi:28}]
    ];
  } else if (hook === 'family') {
    prompt = state.family ? state.family + ' gửi thư. Một năm mất mùa khiến người trong nhà tranh nhau quyền giữ linh điền.' :
      'Những người năm ấy tìm đến, mong có người đứng ra giữ nguồn nước cho xóm nhỏ.';
    options = [
      ['Gửi 35 linh thạch cứu mùa vụ','Ruộng linh cốc được mở lại sau mùa hạn.',{stones:-35,karma:20,luck:9}],
      ['Về tận nơi lập trận dẫn nước','Ngươi đổi một phần linh lực lấy dòng nước ổn định.',{qi:-12,heart:12,karma:9}],
      ['Để người trong làng tự định đoạt','Họ lập sổ chia nước và gửi ngươi bản đầu tiên.',{insight:7,heart:5}]
    ];
  } else if (hook === 'market') {
    prompt = key === 'trade' ? 'Người từng mua tin tìm ngươi, lần này để chia phần trong một thương vụ.' :
      'Chủ sàn gửi thư. Người giữ món đồ năm ấy muốn mở niêm phong trước mặt ngươi.';
    options = [
      ['Tham dự và xin chép bản khắc','Bên dưới lớp sáp có một trang cổ phổ.',{manuals:1,insight:5}],
      ['Nhận phần linh thạch','Thương hội đưa túi linh thạch rồi thu hồi tín vật.',{stones:key === 'trade' ? 65 : 38}],
      ['Chuyển bảo vật về nơi xuất xứ','Bậc cao niên cảm tạ và biếu một lá phù.',{karma:11,ward:1}]
    ];
  } else {
    prompt = key === 'risk' ? 'Vết thương cũ bỗng nóng lên, chỉ về lối vào thứ hai của bí cảnh.' :
      'Những nét ngươi chép năm ấy trùng với lối mở mới trên bản đồ bí cảnh.';
    options = [
      ['Bước vào lối mở lần nữa','Ngươi đi hết đường hầm và tìm thấy một giếng linh lực.',{health:-13,qi:30,manuals:1}],
      ['Dựng trận pháp bên ngoài','Trận pháp giữ được linh khí mà không làm sập cửa đá.',{qi:17,insight:8}],
      ['Chỉ cửa động cho người giữ núi','Người ấy đưa ngươi hai viên đan để tạ ơn.',{pills:2,karma:7}]
    ];
  }
  return [title,prompt,options.map(([label,message,changes],index) => linkChoice(label,'',() => {
    state.pending = null;
    apply(changes);
    if (npc && index === 0) affinity(npc,22);
    note(title + ' — ' + message,changes.health < 0 ? 'danger' : 'good');
    state.storyHistory.push({age:state.age,index:thread.index ?? null,choice:index,followup:true});
    finish();
  },state.stones >= -(changes.stones || 0) && state.ward >= -(changes.ward || 0))),true];
}

function advanceYear() {
  if (state.pending || state.dead) return;
  state.age++;
  state.actions = {};
  expireWorld();
  const world = activeWorld();
  const {gain} = calculateYearlyQi();
  state.cultivationRetreat = Math.max(0,state.cultivationRetreat - 1);
  state.insightPoints += 1 + Math.floor(state.insight / 35) + (world === 'pilgrims' ? 3 : 0);
  const before = state.qi;
  const recovery = state.age > lifespan() * .78 ? 0 : 2;
  apply({qi:gain,mana:Math.floor((14 + art('regen') + state.realm * 4) * (world === 'silence' ? .5 : 1)),
    health:recovery,heart:state.heart < 25 ? 0 : 1,
    stones:state.age >= 12 ? 3 + state.realm + (state.sect ? 3 : 0) : 0});
  if (!target()) note('Ngươi tọa thiền dưới tán tùng, lòng hướng về tiên giới.');
  else if (state.qi > before) note('Ngươi vận công qua bốn mùa, thu thêm ' + (state.qi - before) + ' tu vi.');
  else note('Tu vi đã sung mãn. Bình cảnh vẫn chờ ngươi bước qua.');
  if (state.heart < 26 && !(state.physique === 'pure' && state.realm < 3) &&
    die(1,100) <= 75 - state.heart * 2 - art('mind')) {
    apply({health:-die(12,24),qi:-Math.ceil(target() * .2),heart:-4});
    note('Tẩu hỏa nhập ma! Linh lực nghịch hành, kinh mạch đau như lửa đốt.', 'danger');
  }
  advanceWorld();
  advanceCraft();
  checkDeath();
  if (!state.dead) {
    if (!yearlySaga() && !openDueStory()) {
      if (world === 'invasion' && state.realm >= 1 && die(1,100) <= 30) {
        startFight('ambush','Tiền Phong Ma Đạo',state.realm);
      } else if (state.age >= state.nextEvent) {
        if (state.age >= 12 && state.realm >= 1 && die(1,100) <= 22) spawnEncounter();
        else EventDirector.open();
        state.nextEvent = state.age + die(1,3);
      }
    }
  }
  finish();
}

function promote(major) {
  state.qi = 0;
  if (major) {
    state.realm++;
    state.step = 0;
    apply({beauty:die(3,8)});
    achievement('Chứng đắc ' + stage().name);
    note('Thiên địa đổi sắc. Ngươi bước vào ' + title() + ', thọ nguyên tăng đến ' + number(lifespan()) + ' năm.', 'good');
    if (!target()) {
      note('Thiên môn mở. Ngươi đã phi thăng, và vẫn có thể viết tiếp nhật ký ở tiên giới.', 'good');
      state.ascension = {age:state.age,score:power(),karma:state.karma,skillLoadout:structuredClone(state.skillLoadout),
        skillBook:{...state.skillBook},sagaHistory:state.sagaHistory.slice(-6)};
      state.pending = {type:'ascension'};
    }
  } else {
    state.step++;
    note('Linh lực phá tan bình cảnh. Ngươi tiến đến ' + title() + '.', 'good');
  }
  apply({heart:6,health:5});
}

function breakthrough() {
  if (!unlocked()) return;
  activeMenu = '';
  if (state.step + 1 < stage().stages.length) {
    const odds = breakthroughFactors().chance;
    state.breakBoost = 0;
    if (die(1,100) <= odds) promote(false);
    else {
      apply({qi:-Math.ceil(target() * .36),health:-6,heart:-5});
      note('Bình cảnh rung chuyển rồi khép lại. Ngươi phải điều tức để dưỡng thương.', 'danger');
    }
  } else {
    const cost = state.physique === 'ancient' ? Math.ceil((state.realm + 1) * 18 * 1.5) : 0;
    if (state.stones < cost) {
      note('Hoang Cổ Thánh Thể cần ' + cost + ' linh thạch làm trận dẫn lôi.','danger');
      finish();
      return;
    }
    apply({stones:-cost});
    state.pending = {type:'storm', strike:1,total:(state.realm < 2 ? 2 : 3) + (state.physique === 'chaos' ? 2 : 0)};
    if (state.physique === 'chaos') note('Cửu Tiêu Thần Lôi nhận ra khí tức Hỗn Độn.','sacred');
    note('Mây kiếp tụ trên đỉnh đầu. Muốn bước vào ' + realms[state.realm + 1].name + ', ngươi phải vượt thiên lôi.');
  }
  finish();
}

function takeLightning(method) {
  const storm = state.pending;
  let guard = 0;
  if (method === 'ward') {
    if (!state.ward) return;
    apply({ward:-1});
    guard = 19;
  } else if (method === 'pill') {
    if (!state.pills) return;
    apply({pills:-1,health:18});
    guard = 10;
  }
  const damage = lightningDamage(storm,die(11,20),guard,state.health);
  state.breakBoost = 0;
  if (state.wardCharges && --state.wardCharges === 0) state.pillGuard = 0;
  for (const item of [activeGear('main'),activeGear('natal')].filter(Boolean)) {
    note('Ngươi tế xuất ' + gearName(item) + ' giữa lôi quang.');
  }
  apply({health:-damage});
  note('Lôi kiếp thứ ' + storm.strike + ' giáng xuống, hao ' + damage + ' khí huyết.', 'danger');
  if (state.health > 0 && storm.strike === storm.total) {
    state.pending = null;
    promote(true);
    if ([2,4,6].includes(state.realm) && state.awakening < 3) awakenBody();
    const murdered = state.npcs.filter(npc => npc.lost && npc.memory.some(entry => entry.deed === 'Bị giết trong giao chiến'));
    if (!state.pending && [3,4].includes(state.realm) && state.karma <= -60 && murdered.length) {
      const ghost = pick(murdered);
      state.delayed.push({due:state.age,special:'causal',flag:'tombMurder',branch:3,ghost:ghost.name,
        text:'Tâm Ma mang gương mặt ' + ghost.name + ', người ngươi từng giết trong một trận đấu.'});
    }
  } else storm.strike++;
  finish();
}

function lightningDamage(storm,roll,guard,health) {
  const protection = Math.floor(state.luck / 12 + health / 22 + Math.max(0,state.karma) / 20) +
    (state.pet ? 3 : 0) + state.guard + guard + Math.floor(battleStats().def / 4);
  const raw = roll + state.realm * 3 + storm.strike * 2 - protection +
    (state.sectId === 'blood' ? 4 : 0) + Math.floor(Math.max(0,-state.karma) / 18) -
    (state.wardCharges ? state.pillGuard : 0) - Math.floor(state.breakBoost / 4);
  const tribulation = (state.physique === 'chaos' ? 1.3 : 1) * (state.talents.includes('Thiên Đố Anh Tài') ? 1.5 : 1);
  return Math.max(2,Math.round(raw * tribulation *
    (1 - Math.min(85,gearTotal('resist') + art('resist') + body('storm') * 100) / 100)));
}

function lightningForecast(storm,guard = 0,health = state.health) {
  const outcomes = Array.from({length:10},(_,index) => lightningDamage(storm,index + 11,guard,health));
  return Math.min(...outcomes) + '–' + Math.max(...outcomes) + ' sát thương · sống qua đạo này ' +
    outcomes.filter(amount => amount < health).length * 10 + '%.';
}

function action(id, label, hint, handler, ready = true) {
  return {label,hint,disabled:!ready || Boolean(state.actions[id]), run() {
    if (!ready || state.actions[id]) return;
    state.actions[id] = true;
    handler();
    finish();
  }};
}

function effect(changes, message, trophy) {
  return () => {
    apply(changes);
    note(message,'good');
    if (trophy) achievement(trophy);
  };
}

function bagMenu() {
  return ['Kinh Thư','Công pháp đã ngộ: ' + state.manualLevel + ' · Hộ Kiếp Phù: ' + state.ward,[
    action('read','Tham ngộ công pháp ×' + (state.manuals + state.techniques.length),'Mỗi năm thử một lần · Ngộ Tính cao giúp dễ lĩnh hội.',() => {
      if (die(1,100) <= Math.min(98,25 + comprehension() * .7)) {
        const technique = state.techniques.shift();
        if (technique) {
          state.learned.push(technique.name);
          apply({manualLevel:technique.level,attack:technique.level});
          note('Ngươi lĩnh hội ' + technique.name + '.', 'good');
        } else effect({manuals:-1,manualLevel:1,insight:4},'Ngươi ngộ ra khẩu quyết. Từ nay tốc độ vận công tăng lên.','Lĩnh hội công pháp')();
        const candidate = Object.values(skills).find(skill => skill.realm <= state.realm && !state.skillBook[skill.id]);
        if (candidate) learnArt(candidate.id);
        else state.insightPoints += 4;
      } else effect({heart:-3,insight:2},'Khẩu quyết còn mơ hồ. Ngươi khép sách, giữ lại để đọc tiếp năm sau.')();
    },state.manuals > 0 || state.techniques.length > 0),
    linkChoice('Về Động Phủ','',() => showMenu('gear'))
  ]];
}

function fateMenu() {
  return ['Thế Giới','Chọn việc muốn làm trước khi bước sang năm mới.',[
    linkChoice('Động Phủ','Đan lô, luyện khí, dược viên và Vạn Bảo Lâu.',() => showMenu('gear')),
    {label:'Đột Phá',hint:target() ? 'Cần đủ ' + target() + ' tu vi.' : 'Ngươi đã phi thăng tiên giới.',
      disabled:!unlocked(),run:breakthrough},
    action('auction','Vào Đấu Giá Hội','Từ 12 tuổi · Đặt cọc 18 linh thạch, rồi chọn mức trả giá.',() => {
      state.pending = {type:'auction', weapon:!state.gear.some(item => item.type === 'sword')};
      apply({stones:-18});
    },state.age >= 12 && state.stones >= 18),
    action('explore','Thám Hiểm Bí Cảnh Vân Mộng','Từ Luyện Khí · thu dược liệu, khoáng thạch và Yêu Đan.',() => {
      const victory = rollCombat(21 + battleStats().atk * .7 + state.luck * .35 + state.karma * .15 + (state.sectId === 'star' ? 15 : 0));
      narrateCombat(victory);
      if (victory) {
        effect({stones:state.sectId === 'star' ? 55 : 32,manuals:1,qi:15},'Ngươi tìm được kho sách trong động phủ đổ nát.','Khám phá Bí Cảnh Vân Mộng')();
        rewardMaterials(materialTier(),materialTier() >= 2 && die(1,3) === 1 ? 'beast' : '');
        if (state.sectId === 'star' || activeWorld() === 'ancient') rewardMaterials(materialTier());
      } else {
        apply({health:-combatDamage(die(12,24)),qi:7});
        gainMaterial(pick(herbs.filter(item => item[2] === materialTier()))[0]);
        note('Trận đá sụp xuống. Ngươi thoát ra với kinh mạch bị chấn thương.','danger');
      }
    },state.realm >= 1),
    action('hunt','Săn yêu thú đầu lĩnh','Từ Luyện Khí · chiến đấu theo lượt · có thể dùng đan hoặc rút lui.',() => {
      startFight('beast','Yêu Thú Đầu Lĩnh Vân Mộng',Math.max(0,state.realm - 1));
    },state.realm >= 1),
    action('tea','Thưởng Ngộ Đạo Trà','16 linh thạch · nhận 4 Điểm Lĩnh Ngộ và hồi 5 đạo tâm.',() => {
      apply({stones:-16,insightPoints:4,heart:5});
      note('Ngươi uống Ngộ Đạo Trà và chép lại bốn điều vừa lĩnh hội.','good');
    },state.stones >= 16),
    action('relic','Khảo sát nhẫn cổ','Từ Trúc Cơ · Cần 20 linh thạch khai trận. Có thể gặp một vị lão quái vật.',() => {
      apply({stones:-20});
      createNpc('master','Tàn hồn trong cổ giới',22);
      note('Một tàn hồn thức giấc trong nhẫn và hỏi ngươi có muốn học đạo không.','good');
    },state.realm >= 2 && state.stones >= 20 && !state.npcs.some(npc => npc.origin === 'Tàn hồn trong cổ giới'))
  ]];
}

  {id:'herb',name:'Dược Vương Cốc',path:'Trung Lập',focus:'Đan đạo · tăng thọ nguyên và tỷ lệ luyện đan',gift:{pills:3},art:'Bách Thảo Đan Kinh'},

function upgradeSave() {
  const legacySect = {'Thanh Vân Tông':'sword','Huyền Kiếm Môn':'sword'};
  const defaults = {
    sex:'Nam',appearance:{hair:0,robe:0,face:0},attack:0,alchemy:0,charm:0,longevity:0,beast:0,
    guard:0,cultivation:0,sectId:legacySect[state.sect] || '',rank:0,reputation:0,faction:-1,
    support:[0,0],board:[],pavilion:[],techniques:[],learned:[],npcs:[],nextNpc:1,
    masterId:0,partnerId:0,delayed:[],storyHistory:[],family:''
  };
  const legacy = !Object.hasOwn(state,'npcs');
  for (const [key,value] of Object.entries(defaults)) state[key] ??= value;
  if (state.sectId) state.sect = sects.find(sect => sect.id === state.sectId).name;
  if (legacy && state.bond) {
    const npc = createNpc('companion','Cố nhân',clamp(60 + state.bond,60,100));
    npc.name = 'Ninh Vân';
    state.partnerId = npc.id;
  }
  if (legacy && state.mentor && state.sectId) {
    state.masterId = createNpc('master','Trưởng lão tông môn',clamp(20 + state.mentor,20,100)).id;
  }
  if (legacy && state.rival) createNpc('rival','Oan gia từ chuyện cũ',-30);
  upgradeCraft();
  upgradeRpg();
  upgradeDestiny();
}

function lifespan() {
  return stage().life + state.longevity + Math.round(body('life')) + (state.sectId === 'herb' ? 15 + state.realm * 8 : 0);
}

function randomDraft() {
  return {name:pick(['Lâm','Tạ','Mạc','Thẩm','Bạch','Cố','Liễu']) + ' ' +
    pick(['Phong','Thanh Hòa','Vân Chi','Huyền','Trường An','Nguyệt','Tử Du']),sex:''};
}

function portraitMarkup(appearance, sex, age, realm, life, equipped) {

  const aura = ['#9cb9a9','#cfebe7','#a5f6dd','#f2c163','#c9bcff','#b8eafa','#f0a0ba','#ffe5a5'][realm];
  const weaponColor = equipped && ['#eee9df','#87e3a9','#87c7f4','#cda0ff','#ffd478'][equipped.grade];
  const silhouette = equipped && {sword:'M83 76 88 29 91 40 86 77m-9-7 14 3',
    spear:'M80 98 89 30m-5 10 5-15 4 14',staff:'M80 98 87 43m0 0a7 7 0 1 0 0-14 7 7 0 0 0 0 14',
    bell:'M74 68q6-5 6-17 7-12 14 0 0 12 5 17Zm10 5h4'}[equipped.type];
  return `<svg viewBox="0 0 100 116" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M0 91 21 72l15 11 30-24 34 26v31H0Z" fill="#235750"/>
    <circle cx="50" cy="48" r="${realm >= 3 ? 36 : 30}" fill="${aura}" opacity=".13"/>
    ${realm >= 2 ? `<path d="M77 75 89 32l-2 15-8 29m-6-7 11 4" stroke="${aura}" fill="none" stroke-width="2"/>` : ''}
    ${realm >= 3 ? `<ellipse cx="50" cy="38" rx="37" ry="33" fill="none" stroke="${aura}" stroke-width="1.5"/><circle cx="50" cy="6" r="3" fill="${aura}"/>` : ''}
    ${equipped ? `<path d="${silhouette}" fill="none" stroke="${weaponColor}" stroke-width="${equipped.refine >= 3 ? 3 : 2}" ${equipped.refine >= 3 ? 'style="filter:drop-shadow(0 0 3px ' + weaponColor + ')"' : ''}/>` : ''}
    <g transform="${child ? 'translate(8 18) scale(.84)' : 'translate(0 0)'}">
      ${hair === 0 ? `<circle cx="50" cy="22" r="11" fill="${hairColor}"/>` : `<path d="M31 42q8-31 35-15l9 ${hair === 1 ? '60' : '39'}-49 7Z" fill="${hairColor}"/>`}
      <path d="M15 116q3-34 23-36l24 0q22 4 25 36Z" fill="${robeColor}"/>
      <path d="M26 116 42 86l9 8 10-8 16 30" fill="none" stroke="${realm === 1 ? '#fffdf7' : aura}" stroke-width="5"/>
      ${realm === 1 ? '<path d="M18 112q2-20 17-26l-10 30H17Zm65 0q-2-20-17-26l10 30h8Z" fill="#f6f4e9"/>' : ''}
      ${realm >= 3 ? `<path d="m20 106 7 2m46 0 7-2M31 113h38" stroke="${aura}" stroke-width="2"/><path d="m50 95 4 5-4 5-4-5Z" fill="${aura}"/>` : ''}
      <path d="M43 69v13l8 8 8-8V69" fill="#c98e71"/>
      <ellipse cx="50" cy="53" rx="19" ry="23" fill="#ecc09e"/>
      <path d="M29 52q-5-30 21-30t21 29q-10-4-17-18-8 15-25 19Z" fill="${hairColor}"/>
      ${sex === 'Nữ' ? `<path d="M66 32l12-8m-6 9 1 14" stroke="${aura}" stroke-width="2"/>` : ''}
      <path d="${face === 2 ? 'M38 53l7 2m10 0 7-2' : 'M39 54h5m12 0h5'}" stroke="#372b2b" stroke-width="2" stroke-linecap="round"/>
      <path d="${face === 1 ? 'M45 62q5 6 10 0' : 'M46 64h8'}" fill="none" stroke="#975f54" stroke-width="1.5"/>
      ${elderly && sex === 'Nam' ? '<path d="M42 68q8 5 16 0-1 18-8 22-7-7-8-22Z" fill="#e1e7e7"/>' : ''}
    </g></svg>`;
}

function showCreation(draft = randomDraft(),required = true) {
  activeMenu = '';
  const {form,field} = workFields();
  const name = field('Họ & tên',null,draft.name);
  name.placeholder = 'Nhập họ và tên';
  const sex = field('Giới tính',[['','Ngẫu nhiên'],['Nam','Nam'],['Nữ','Nữ']],draft.sex);
  const feedback = textElement('p','','form-feedback');
  feedback.setAttribute('role','status');
  form.append(feedback);
  showSheet('Thiên Mệnh Đầu Thai','Xuất thân, linh căn, thể chất, dung mạo và ba thiên phú do Luân Hồi Bàn định đoạt.',[
    linkChoice('⚄ Gieo tên khác','',() => {name.value = randomDraft().name;}),
    {label:'Bắt Đầu Kiếp Này',primary:true,run() {
      const chosen = name.value.trim().replace(/\s+/g,' ');
      if (!chosen) {feedback.textContent = 'Hãy nhập tên hoặc gieo tên ngẫu nhiên.';return;}
      $('logs').replaceChildren();
      newLife({name:chosen,sex:sex.value});
      state.pending = {type:'destiny'};
      finish();
    }}
  ],required,form);
}

function linkChoice(label, hint, run, ready = true) {
  return {label,hint,run,disabled:!ready};
}

      showCreation({name:state.name,sex:state.sex},false))] : [])
  ],false,details];

function showAppearance() {
  const appearance = {...state.appearance};
  const form = textElement('div','','form-grid');
  const picture = textElement('div','','character-art');
  picture.style.gridColumn = '1/-1';
  const draw = () => { picture.innerHTML = portraitMarkup(appearance,state.sex,state.age,state.realm,lifespan(),activeGear('main')); };
  form.append(picture);
  for (const [key,label,options] of [['hair','Kiểu tóc',hairStyles],['robe','Y phục',robeStyles.map(robe => robe[0])],['face','Thần thái',faces]]) {
    const wrapper = textElement('label',label);
    const select = document.createElement('select');
    options.forEach(option => select.append(textElement('option',option)));
    select.selectedIndex = appearance[key];
    select.addEventListener('change',() => { appearance[key] = select.selectedIndex; draw(); });
    wrapper.append(select);
    form.append(wrapper);
  }
  draw();
  showSheet('Chỉnh dung mạo','',[
    linkChoice('Lưu dung mạo','',() => { state.appearance = appearance; activeMenu = 'profile'; finish(); }),
    linkChoice('Về Đạo Thân','',() => showMenu('profile'))
  ],false,form);
}

function power() {
  return battleStats().score;
}

function refreshBoard() {
  const prior = state.board.map(entry => entry.mission);
  state.board = tiers.map((_,tier) => {
    const pool = missions.map((_,index) => index).filter(index => missions[index][2] === tier);
    return {mission:pick(pool.filter(index => index !== prior[tier])),done:false};
  });
}

function advanceWorld() {
  state.npcs.forEach(simulateNpc);
  if (state.family && state.age % 5 === 0) {
    apply({stones:25,heart:4});
    note(state.family + ' gửi thư thăm hỏi và 25 linh thạch từ vụ linh cốc.', 'good');
  }
  if (!state.sectId) return;
  const weekly = state.rank + 1;
  apply({stones:weekly * 52});
  note('Tông môn phát ' + weekly + ' linh thạch mỗi tuần. Ngươi nhận ' + weekly * 52 + ' linh thạch cho 52 tuần.', 'good');
  refreshBoard();
}

function sectMenu() {
  if (!state.sectId) return ['Tông Môn','Từ 8 tuổi, ngươi có thể chọn một sơn môn để bái nhập.',sects.map(sect =>
    action('join',sect.name,sect.path + ' · ' + sect.focus,() => {
      state.sect = sect.name;
      state.sectId = sect.id;
      apply({contribution:10,...sect.gift});
      refreshBoard();
      createNpc('peer','Đồng môn',12);
      note('Ngươi dâng trà trước tổ đường ' + sect.name + '.', 'good');
      achievement('Đệ tử ' + sect.name);
    },state.age >= 8))];
  const cost = [25,55,100,165,250][state.rank];
  const standing = [10,30,65,100,150][state.rank];
  const requiredRealm = [1,1,2,3,4][state.rank];
  const political = state.rank < 3 || (state.faction >= 0 && state.support[state.faction] >= (state.rank === 3 ? 24 : 55));
  return ['Tông Môn',state.sect + ' · ' + ranks[state.rank] + ' · ' + (state.rank + 1) +
    ' linh thạch mỗi tuần. Công trạng: ' + state.contribution + ' · Danh vọng: ' + state.reputation +
    (state.karma >= 40 && state.sectId !== 'blood' ? ' · Danh hiệu: Hộ Đạo Sứ' :
      state.karma <= -40 && ['blood','moon'].includes(state.sectId) ? ' · Danh hiệu: Huyết Ấn Sứ' : ''),[
    linkChoice('Nhiệm Vụ Đường','Bốn nhiệm vụ từ Nhân cấp đến Thần cấp.',() => showMenu('missions')),
    linkChoice('Tàng Kinh Các','Đổi công trạng lấy công pháp theo phẩm cấp.',() => showMenu('pavilion')),
    linkChoice('Nghị Sự Đường','Chọn phe, vận động trưởng lão và mở đường kế vị.',() => showMenu('council')),
    action('promotion',cost ? 'Tấn phong ' + ranks[state.rank + 1] : 'Chưởng Môn đương nhiệm',
      cost ? cost + ' công trạng · ' + standing + ' danh vọng · ' + realms[requiredRealm].name +
        (state.rank >= 3 ? ' · cần hậu thuẫn của phe đã chọn' : '') : 'Đã đạt phẩm trật cao nhất.',() => {
        apply({contribution:-cost});
        state.rank++;
        note('Chuông tông môn ngân vang. Ngươi được tấn phong ' + ranks[state.rank] + '.', 'good');
        achievement(ranks[state.rank] + ' · ' + state.sect);
      },Boolean(cost) && state.realm >= requiredRealm && state.reputation >= standing && state.contribution >= cost && political),
    action('tournament','Chung kết Tông Môn Đại Bỉ','Từ Ngoại Môn · mỗi năm một trận · quy củ cấm rời đài khi đang đấu.',() => {
      startFight('tournament','Đối Thủ Chung Kết',Math.max(0,state.realm - 1,Math.floor(state.rank / 2)));
    },state.rank >= 1)
  ]];
}

function missionMenu() {
  if (!state.board.length) refreshBoard();
  const choices = state.board.map((entry,tier) => {
    const [name,hint] = missions[entry.mission];
    const odds = clamp(Math.round(46 + battleStats().atk * .75 + state.luck * .22 - tier * 27),8,96);
    return action('mission-' + tier,tiers[tier] + ' cấp · ' + name,
      hint + ' Thành công ' + odds + '% · ' + (entry.done ? 'Đã nhận năm nay.' : 'Cần ' + ranks[[0,1,2,4][tier]] + '.'),() => {
        entry.done = true;
        const victory = die(1,100) <= odds;
        const reward = 16 + tier * 13;
        apply(victory ? {stones:reward * 2,contribution:reward,reputation:10 + tier * 5,health:-3 - tier} :
          {health:-7 - tier * 6,reputation:2,contribution:3});
        note(name + ' — ' + (victory ? 'Chấp sự nghiệm thu tín vật và ban thưởng.' : 'Ngươi lui về sơn môn, thương thế còn đau nhức.'),victory ? 'good' : 'danger');
        if (victory) rewardMaterials(tier + 1,name.includes('yêu thú') ? 'beast' : '');
        if (victory && state.sectId === 'blood') {
          apply({qi:8 + tier * 4,karma:-3 - tier});
          note('Huyết Sát Ma Giáo dạy ngươi đoạt linh khí từ chiến lợi phẩm. Thiện nghiệp suy giảm.');
        }
        if (victory && tier === 3) achievement('Hoàn thành nhiệm vụ Thần cấp');
        if (!state.pending && state.age >= 12 && state.realm >= 1 && die(1,100) <= 12) spawnEncounter();
      },!entry.done && state.rank >= [0,1,2,4][tier]);
  });
  return ['Nhiệm Vụ Đường','Bảng tự đổi mỗi năm. Có thể xin đổi sớm một lần trước khi nhận nhiệm vụ.',[
    ...choices,action('refresh','Đổi bảng nhiệm vụ','Cần 8 công trạng.',() => {
      apply({contribution:-8});
      refreshBoard();
    },state.contribution >= 8 && !state.board.some(entry => entry.done)),
    linkChoice('Về Tông Môn','',() => showMenu('sect'))
  ]];
}

function pavilionMenu() {
  const sect = sects.find(entry => entry.id === state.sectId);
  const choices = ranks.map((rank,index) => {
    const name = sect.art + ' · Quyển ' + (index + 1);
    const cost = 12 + index * 13;
    const acquired = state.pavilion.includes(name);
    return linkChoice(name,acquired ? 'Đã thu nhận.' : rank + ' · ' + cost + ' công trạng.',() => {
      apply({contribution:-cost});
      state.pavilion.push(name);
      state.techniques.push({name,level:index + 1});
      note('Ngươi mang ' + name + ' về động phủ để tham ngộ.', 'good');
      finish();
    },!acquired && state.rank >= index && state.contribution >= cost);
  });
  return ['Tàng Kinh Các','Kinh thư đã đổi có thể tham ngộ trong Túi Đồ.',[
    linkChoice('Đổi Bí Bản Võ Học','Công pháp theo cảnh giới và phẩm trật.',() => showMenu('skillPavilion')),
    ...choices,linkChoice('Đổi Hộ Kiếp Phù','20 công trạng.',() => {
      effect({contribution:-20,ward:1},'Chấp sự trao ngươi một lá Hộ Kiếp Phù.')();
      finish();
    },state.contribution >= 20),linkChoice('Về Tông Môn','',() => showMenu('sect'))
  ]];
}

function councilMenu() {
  const choices = paths.map((path,index) => action('council','Ủng hộ phe ' + path,
    (index === 0 ? 'Giữ sơn môn, thiên về thiện nghiệp.' : 'Mở rộng địa bàn, thiên về linh thạch.') +
      ' Hậu thuẫn: ' + state.support[index] + '.',() => {
      const switched = state.faction >= 0 && state.faction !== index;
      if (switched) state.support[state.faction] = Math.max(0,state.support[state.faction] - 14);
      state.faction = index;
      state.support[index] += 12;
      apply(index === 0 ? {karma:5,reputation:7} : {stones:28,karma:-4,reputation:7});
      note('Ngươi đứng về phía ' + path + (switched ? '. Phe cũ rút lời ủng hộ.' : ' trong nghị sự trưởng lão.'));
    },state.rank >= 2));
  return ['Nghị Sự Đường','Từ Nội Môn được dự nghị sự. Tấn phong Trưởng Lão cần 24 hậu thuẫn, kế vị Chưởng Môn cần 55.',[
    ...choices,
    action('petition','Hòa giải tranh chấp hai phe','Từ Chân Truyền · đổi 14 công trạng lấy hậu thuẫn và thiện nghiệp.',() => {
      state.support[state.faction] += 18;
      effect({contribution:-14,reputation:10,karma:6},'Hai phe hạ kiếm. Trưởng lão ghi nhận tài hòa giải của ngươi.')();
    },state.rank >= 3 && state.faction >= 0 && state.contribution >= 14),
    linkChoice('Về Tông Môn','',() => showMenu('sect'))
  ]];
}

function createNpc(role, origin = pick(origins[role] || ['Người quen giang hồ']), affinity = 0) {
  const mentor = role === 'master';
  const npc = {
    id:state.nextNpc++,role,origin,affinity:clamp(affinity,-100,100),
    name:pick(['Tần','Ninh','Tô','Lạc','Diệp','Tiêu','Cố','Mộ Dung','Kỷ']) + ' ' +
      pick(['Vân','Tử Yên','Hàn Sơn','Bích Dao','Thanh Trúc','Tuyết','Vô Trần','Dạ Ly','Yên Chi']),
    age:mentor ? state.age + die(30,180) : Math.max(role === 'companion' ? 18 : 8,state.age + die(-2,5)),
    realm:clamp(state.realm + (mentor ? die(1,2) : die(-1,1)),mentor ? 1 : 0,7),
    personality:pick(['Chính Trực','Âm Hiểm','Si Tình','Lạnh Lùng','Kiêu Ngạo','Ôn Nhu','Hám Lợi']),
    root:die(0,roots.length - 1),lost:false
  };
  initializeNpc(npc);
  if (state.beauty !== undefined && npc.sex !== state.sex && beauty() >= 80) npc.affinity = clamp(npc.affinity + 30,-100,100);
  if (state.beauty !== undefined && beauty() <= 25 && ['sword','beast'].includes(npc.sect)) npc.affinity = clamp(npc.affinity - 8,-100,100);
  state.npcs.push(npc);
  return npc;
}

function affinity(npc, amount) {
  const temperament = {'Chính Trực':1,'Âm Hiểm':-2,'Si Tình':3,'Lạnh Lùng':-3,'Kiêu Ngạo':-2,'Ôn Nhu':3,'Hám Lợi':0}[npc.personality] || 0;
  const extra = amount > 0 ? temperament + Math.floor(state.charm / 4) +
    (state.sectId === 'moon' && npc.role === 'companion' ? 5 : 0) : 0;
  npc.affinity = clamp(npc.affinity + amount + extra,-100,100);
}

function upgradeCraft() {
  if (state.materials) return;
  Object.assign(state,{materials:{khithao:2,linhsam:2,tamhoa:2,huyetqua:1,huyenthiet:2,mocngoc:1},
    pillStock:{}, recipes:['qi','heal','heart'],gear:[],equipment:{},nextGear:1,cauldron:1,toxin:0,
    purity:0,breakBoost:0,wardCharges:0,pillGuard:0,battleTurns:0,battleBoost:0,garden:[],overflow:{},natalPlan:null});
  const previous = state.weapon || 0;
  for (let i = 0; i < previous; i++) {
    const sword = makeGear('sword','Hộ Sơn Kiếm',0,1,'huyenthiet');
    if (!i && state.equipped) state.equipment.main = sword.id;
  }

}

function makeGear(type,name,grade,tier,base) {
  const item = {id:state.nextGear++,type,name,grade,tier,base,roll:die(0,5),refine:0,growth:0,
    affix:pick(['blood','pierce','lightning','channel'])};
  state.gear.push(item);
  return item;
}

function gearStats(item) {
  const n = item.tier * 2 + item.grade * 3 + item.roll + item.refine * 2 + item.growth * 2;
  const stats = {attack:0,defense:0,health:0,qi:0,capacity:0,income:0,critical:0,pierce:0,resist:0,leech:0};
  switch (item.type) {
    case 'sword': stats.attack = n + 5; stats.critical = 10 + n + (state.sectId === 'sword' ? 10 : 0); break;
    case 'spear': stats.attack = n + 6; stats.pierce = n + 5; break;
    case 'staff': stats.attack = n; stats.qi = 2 + Math.floor(n / 3); break;
    case 'bell': stats.defense = n; stats.resist = 12 + n; break;
    case 'natal': stats.qi = 2 + Math.floor(n / 3); stats.defense = Math.floor(n / 2); stats.resist = n; break;
    case 'armor': stats.health = 8 + n; stats.defense = 3 + n; break;
    case 'ring': stats.capacity = 12 + n * 2; stats.income = 2 + Math.floor(n / 2); break;
  }
  if (item.refine >= 3) {
    const key = {blood:'leech',pierce:'pierce',lightning:'resist',channel:'qi'}[item.affix];
    stats[key] += {leech:10,pierce:12,resist:15,qi:4}[key] + (item.refine >= 7 ? 3 : 0);
  }
  return stats;
}

function gearTotal(key) {
  return Object.keys(slots).reduce((total,slot) => {
    const item = activeGear(slot);
    return total + (item ? gearStats(item)[key] : 0);
  },0);
}

const maxHealth = () => Math.round((100 + state.realm * 9 + gearTotal('health') + art('hp')) * (1 + body('hp')));
const capacity = () => 36 + gearTotal('capacity');
const materialLoad = () => Object.values(state.materials).reduce((total,count) => total + count,0);

function gainMaterial(id,count = 1) {
  const carried = Math.min(count,Math.max(0,capacity() - materialLoad()));
  if (carried) state.materials[id] = owned(id) + carried;
  if (carried < count) {
    state.overflow[id] = (state.overflow[id] || 0) + count - carried;
    note('Túi đầy. ' + (count - carried) + ' ' + herbName(id) + ' được gửi vào kho động phủ.');
  }
}

function rewardMaterials(tier,source) {
  const level = clamp(tier,1,4);
  const herb = pick(herbs.filter(item => item[2] === level));
  const ore = source === 'beast' ? materialById('yeodan') : pick(minerals.filter(item => item[2] === level));
  gainMaterial(herb[0],2);
  gainMaterial(ore[0]);
  note('Thu được 2 ' + herb[1] + ' và 1 ' + ore[1] + '.', 'good');
}

function chargeMaterials(ids) {
  const required = {};
  ids.forEach(id => { required[id] = (required[id] || 0) + 1; });
  if (Object.entries(required).some(([id,n]) => owned(id) < n)) return false;
  for (const [id,n] of Object.entries(required)) state.materials[id] -= n;
  return true;
}

const formulaTier = formula => materialById(formula[2][0])[2];
const matchingFormula = ids => formulas.find(formula => formula[2][0] === ids[0] &&
  formula[2].slice(1).sort().join() === ids.slice(1).sort().join());
const pillKey = (id,grade) => id + ':' + grade;

function consumePill(id,grade) {
  const key = pillKey(id,grade);
  if (!state.pillStock[key]) return;
  state.pillStock[key]--;
  const formula = formulas.find(entry => entry[0] === id);
  if (!grade) {
    apply({qi:3,mana:3,toxin:9});
  } else {
    const strength = grade === 4 ? 5 : grade;
    const effects = {
      qi:{qi:strength * 12,mana:strength * 8},heal:{health:strength * 13},heart:{heart:strength * 8},
      battle:{battleTurns:2,battleBoost:strength * 5},
      foundation:{breakBoost:strength * 6,wardCharges:1,pillGuard:strength * 3},
      purify:{purity:Math.min(1 - state.purity,strength * .035)},
      guard:{wardCharges:2,pillGuard:strength * 4},detox:{toxin:-strength * 8,heart:strength * 4},
      core:{insight:strength * 2,qi:strength * 13},dragon:{battleTurns:3,battleBoost:strength * 8},
      rebirth:{health:strength * 21},soul:{insight:strength * 2,heart:strength * 8},
      return:{health:strength * 20,heart:strength * 8},life:{longevity:strength * 10},
      thunder:{wardCharges:3,pillGuard:strength * 6},beauty:{beauty:strength * 3}
    };
    const effect = effects[id];
    for (const key of ['battleTurns','battleBoost','pillGuard','wardCharges','breakBoost']) {
      if (effect[key]) effect[key] = Math.max(0,effect[key] - state[key]);
    }
    apply(effect);
    if (grade < 4 && id !== 'detox') apply({toxin:4 - grade});
  }
  note('Ngươi dùng ' + formula[1] + ' · ' + quality[grade] + '. Đan độc: ' + state.toxin + '.',grade ? 'good' : 'danger');
}

function workTabs() {
  const panel = document.createElement('div');
  const nav = textElement('nav','','work-tabs');
  nav.setAttribute('aria-label','Động phủ');
  for (const [menu,label] of [['gear','Túi Đồ & Trang Bị'],['alchemy','Luyện Đan Phòng'],['forge','Luyện Khí Các'],
    ['market','Vạn Bảo Lâu'],['garden','Dược Viên']]) {
    const button = textElement('button',label);
    button.setAttribute('aria-current',String(activeMenu === menu));
    button.addEventListener('click',() => showMenu(menu));
    nav.append(button);
  }
  panel.append(nav);
  return panel;
}

function workFields() {
  const form = textElement('div','','form-grid');
  return {form,field(label,entries,initial) {
    const wrapper = textElement('label',label);
    const control = document.createElement(entries ? 'select' : 'input');
    if (entries) for (const [value,text] of entries) {
      const option = textElement('option',text);
      option.value = value;
      control.append(option);
    }
    else { control.maxLength = 28; control.placeholder = 'Đặt tên pháp bảo'; }
    if (initial !== undefined) control.value = initial;
    wrapper.append(control);
    form.append(wrapper);
    return control;
  }};
}

const optionsFor = items => items.filter(item => owned(item[0])).map(([id,name]) => [id,name + ' ×' + owned(id)]);
const chooseItems = items => [['','Chọn nguyên liệu'],...optionsFor(items)];
const graded = (choice,grade) => ({...choice,grade});
const rerender = (label,hint,run,ready = true) => linkChoice(label,hint,() => {run();finish();},ready);

function filterNav(items,selected,change) {
  const nav = textElement('div','','work-tabs');
  for (const [id,label] of items) {
    const button = textElement('button',label);
    button.setAttribute('aria-current',String(id === selected));
    button.addEventListener('click',() => change(id));
    nav.append(button);
  }
  return nav;
}

function gearMenu() {
  const panel = workTabs();
  panel.append(filterNav([['summary','Trang bị'],['herbs','Dược liệu'],['ores','Khoáng thạch'],
    ['pills','Đan dược'],['weapons','Pháp bảo']],craftFilter,id => {craftFilter = id;showMenu('gear');}));
  const options = [];
  if (craftFilter === 'summary') {
    for (const [slot,label] of Object.entries(slots)) {
      const item = activeGear(slot);
      options.push(graded(rerender(label + ' · ' + (item ? gearName(item) : 'Ô trống'),
        item ? 'Tháo trang bị' : 'Chọn thẻ Pháp bảo để trang bị.',() => {delete state.equipment[slot];},Boolean(item)),item?.grade ?? 0));
    }
    options.push(linkChoice('Kinh thư','Tham ngộ công pháp và xem số Hộ Kiếp Phù.',() => showMenu('bag')));
  } else if (craftFilter === 'weapons') {
    for (const item of state.gear) {
      const slot = gearTypes[item.type][1];
      const equipped = activeGear(slot) === item;
      options.push(graded(rerender(gearName(item),rarity[item.grade] + ' · ' + gearTypes[item.type][0] +
        (equipped ? ' · Đang trang bị' : ' · Trang bị') + ' · ' + gearStatLine(item),() => {state.equipment[slot] = item.id;},
        !equipped && (slot !== 'natal' || state.realm >= 3)),item.grade));
    }
  } else if (craftFilter === 'pills') {
    for (const formula of formulas) for (let grade = 0; grade < quality.length; grade++) {
      const count = state.pillStock[pillKey(formula[0],grade)];
      if (count) options.push(graded(rerender(formula[1] + ' ×' + count,quality[grade] + ' · ' +
        (grade ? formula[3] : 'Hồi 3 linh lực, tăng 9 đan độc.'),() => consumePill(formula[0],grade)),grade));
    }
    if (state.pills) options.push(rerender('Hồi Xuân Đan ×' + state.pills,'Hồi 22 khí huyết và 5 đạo tâm.',
      () => apply({pills:-1,health:22,heart:5}),state.health < maxHealth() || state.heart < 100));
  } else for (const [id,name,tier] of craftFilter === 'herbs' ? herbs : minerals) {
    const fromVault = state.overflow[id] || 0;
    if (owned(id) || fromVault) options.push(graded(rerender(name + ' ×' + owned(id),
      fromVault ? 'Rút từ kho · còn ' + fromVault : 'Phẩm ' + tier,() => {
        const count = Math.min(fromVault,capacity() - materialLoad());
        state.overflow[id] -= count;
        gainMaterial(id,count);
      },fromVault > 0 && materialLoad() < capacity()),tier));
  }
  if (!options.length) panel.append(textElement('p','Chưa có vật phẩm trong mục này.','intro'));
  return ['Động Phủ','Chiến lực: ' + power() + ' · Khoáng và dược liệu: ' + materialLoad() + ' / ' + capacity() +
    ' · Đan độc: ' + state.toxin,options,false,panel];
}

function alchemyMenu() {
  const {form,field} = workFields();

  feedback.setAttribute('role','status');

    book.append(textElement('p',entry[1] + ' · ' + entry[2].map(herbName).join(' + ') + '.'));

      const ids = fields.map(control => control.value);

      finish();
    }),
    rerender('Nâng cấp Đan Đỉnh',state.cauldron === 4 ? 'Đã đạt phẩm cao nhất.' :
      'Tốn ' + state.cauldron * 65 + ' linh thạch.',() => {
      apply({stones:-state.cauldron * 65});
      state.cauldron++;
      note('Ngươi thay đan đỉnh, hỏa lực từ đó ổn định hơn.','good');
    },state.cauldron < 4 && state.stones >= state.cauldron * 65)
  ],false,panel];
}

function furnaceStep(pending) {
  const formula = formulas.find(entry => entry[0] === pending.recipe);
  const {form,field} = workFields();
  const flame = field('Hỏa Hầu',flames.map((name,index) => [index,name]),1);
  const qi = field('Linh Lực Quán Chú',infusions.map((name,index) => [index,name]),0);
  const stage = ['Khởi Hỏa','Dung Hợp','Ngưng Đan'][pending.step];
  const ideal = formula[4][pending.step];
  const hints = ['Dược tính thanh hàn, cần giữ lửa nhỏ.','Dược lực đều, nên dùng lửa vừa.','Dược tính cứng, cần lửa mạnh.'];
  const feedback = textElement('p','','form-feedback');
  feedback.setAttribute('role','status');
  form.append(feedback);
  return [stage,formula[1] + ' · ' + (pending.step + 1) + ' / 3 · ' + hints[ideal] +
    ' Linh lực hiện có: ' + state.mana + '.',[ 
    linkChoice('Điều Hỏa','',() => {
      const cost = 3 * Number(qi.value);
      if (cost > state.mana) {feedback.textContent = 'Không đủ linh lực để quán chú.';return;}
      apply({mana:-cost});
      pending.score += 14 - 9 * Math.abs(Number(flame.value) - ideal) + cost;
      pending.step++;
      if (pending.step === 3) {
        const score = pending.score + comprehension() * .32 + state.alchemy + body('alchemy') + state.cauldron * 9 +
          (state.sectId === 'herb' ? 12 : 0) + (pending.guided ? 8 : 0) - formulaTier(formula) * 10 + die(-18,18);
        const grade = Math.max(state.physique === 'embryo' && state.awakening === 3 && pending.score >= 42 ? 4 : 0,
          [31,49,66,88].filter(limit => score >= limit).length);
        const key = pillKey(formula[0],grade);
        state.pillStock[key] = (state.pillStock[key] || 0) + (grade >= 2 ? 2 : 1);
        state.pending = null;
        if (grade && !state.recipes.includes(formula[0])) state.recipes.push(formula[0]);
        note('Đan lô mở: ' + formula[1] + ' · ' + quality[grade] + '.',grade ? 'good' : 'danger');
        if (grade === 4) achievement('Luyện thành Cực Phẩm Đan Vân');
        activeMenu = 'alchemy';
      }
      finish();
    })
  ],true,form];
}

function forgeMenu() {

      if (state.stones < cost) {feedback.textContent = 'Không đủ linh thạch nuôi chân hỏa.';return;}

  const choices = [linkChoice('Gieo vào linh điền','Tốn một dược liệu giống. Có ba luống.',() => {
    const herb = materialById(seed.value);
    if (!herb || !chargeMaterials([herb[0]])) {feedback.textContent = 'Hãy chọn một dược liệu làm giống.';return;}
    state.garden.push({id:herb[0],ready:state.age + herb[2]});
    note('Ngươi gieo ' + herb[1] + '. Sau ' + herb[2] + ' năm có thể thu hái.');
    finish();
  },state.garden.length < 3)];
  state.garden.forEach((plant,index) => choices.push(graded(rerender('Thu hoạch ' + herbName(plant.id),
    plant.ready <= state.age ? 'Đã chín · thu 3 dược liệu.' : 'Còn ' + (plant.ready - state.age) + ' năm.',() => {
      state.garden.splice(index,1);
      gainMaterial(plant.id,3);
      note('Dược viên cho thu hoạch 3 ' + herbName(plant.id) + '.','good');
    },plant.ready <= state.age),materialById(plant.id)[2])));
  return ['Dược Viên',state.garden.length + ' / 3 luống đang trồng.',choices,false,panel];
}

function advanceCraft() {
  if (state.battleTurns > 0 && --state.battleTurns === 0) state.battleBoost = 0;
  if (state.toxin >= 30) {
    apply({health:-Math.floor(state.toxin / 10),heart:-2});
    note('Đan độc phát tác; kinh mạch đau nhức.','danger');
  }
  apply({toxin:-2,stones:gearTotal('income')});
  const plan = state.natalPlan;
  const item = activeGear('natal');
  if (item && plan?.id === item.id && state.mana >= 12 && state.stones >= 18) {
    apply({mana:-12,stones:-18});
    plan.years++;
    item.nourished = plan.years;
    if (plan.years % 10 === 0) {
      item.growth++;
      note(item.name + ' hấp thu linh tức mười năm, bản mệnh linh quang tiến một bậc.', 'good');
      if (item.growth === 9) state.natalPlan = null;
    }
  }
}

function combatOdds(raw) {
  return raw + Math.floor(gearTotal('pierce') / 2);
}

function rollCombat(raw,includePierce = true) {
  const critical = die(1,100) <= battleStats().crit;
  if (critical) note('Linh quang hội tụ. Đòn bạo kích đánh vỡ thế phòng thủ.', 'good');
  return die(1,100) <= clamp((includePierce ? combatOdds(raw) : raw) + (critical ? 16 : 0),8,97);
}

function combatDamage(amount) {
  return Math.max(1,amount - Math.floor(battleStats().def * .55));
}

function narrateCombat(victory) {
  const item = activeGear('main');
  if (!item) return;
  const move = {sword:'phi kiếm xé gió',spear:'mũi thương chọc thủng hộ thuẫn',
    staff:'trận văn dâng lên từ đầu trượng',bell:'tiếng chuông dội qua tầng hộ thể'}[item.type];
  note('Ngươi tế xuất ' + gearName(item) + ', ' + move + (victory ? '.' : ', cản bớt đòn phản kích.'),victory ? 'good' : '');
  if (victory && gearTotal('leech')) apply({health:Math.ceil(battleStats().atk * gearTotal('leech') / 100)});
}

function upgradeRpg() {
  if (state.rpgVersion === 1) return;
  Object.assign(state,{rpgVersion:1,insightPoints:0,skillBook:{breath:1,windcut:1,iron:1},
    skillLoadout:{core:['breath'],active:['windcut'],passive:[]},worldNext:state.age + die(20,50),
    worldEffect:null,sagaSeen:[],sagaHistory:[],sagaYear:0,ascension:null});
  for (const name of state.learned) {
    const entry = skillRows.find(([,skill]) => name.includes(skill));
    if (entry) state.skillBook[entry[0]] = 1;
  }
  state.mana = manaMax();
}

function learnedEffect(skill,key,level = state.skillBook[skill.id]) {
  const value = skill.effect[key] || 0;
  return ['revive','escape','dodge','defPct'].includes(key) ? value : Math.round(value * (1 + .25 * (level - 1)));
}

function art(key) {
  return [...state.skillLoadout.core,...state.skillLoadout.passive]
    .reduce((sum,id) => sum + learnedEffect(skills[id],key),0);
}

const manaMax = () => 20 + state.realm * 12 + state.step * 2 + Math.floor(state.insight / 5) + art('mana');
const karmaName = () => state.karma >= 80 ? 'Chính Đạo Chí Tôn' : state.karma >= 40 ? 'Hiệp Tu' :
  state.karma <= -80 ? 'Ma Đầu' : state.karma <= -40 ? 'Huyết Hành Giả' : 'Hành Đạo Giả';

function battleStats() {
  const attack = [9 + state.realm * 8 + state.step * 2,state.attack - (state.talents.includes('Trời Sinh Mù Lòa') ? 4 : 0),
    gearTotal('attack'),art('atk'),state.battleBoost,state.manualLevel * 2];
  const defense = [4 + state.realm * 4,gearTotal('defense'),art('def'),Math.floor(state.guard / 2)];
  const sum = xs => xs.reduce((total,x) => total + x,0);
  const atk = Math.round(sum(attack) * (1 + body('atk')));
  const def = Math.floor(sum(defense) * (1 + art('defPct') / 100) * (1 + body('def')));
  const agi = Math.round((14 + state.realm * 5 + Math.floor(comprehension() / 5) + art('agi')) * (1 + body('agi')));
  const rawCrit = Math.round((5 + Math.floor(comprehension() / 12) + gearTotal('critical') + art('crit')) * (1 + body('crit')));
  const crit = Math.min(75,rawCrit);
  const critDmg = Math.round(150 + art('critDmg') + body('critDmg'));
  const techniques = state.skillLoadout.active.reduce((sum,id) => sum + 3 + skills[id].grade * 2 +
    state.skillBook[id] * 2,0);
  const score = Math.floor(atk * 2 + def * 1.25 + agi + maxHealth() * .28 +
    manaMax() * .35 + crit * (critDmg - 100) / 100 + techniques);
  return {atk,def,agi,crit,critDmg,score,attack,defense,rawCrit,techniques};
}

function skillText(skill,level) {
  const e = skill.effect;
  if (skill.type === 'active') return e.cost + ' linh lực · hồi ' + e.cd + ' lượt · ' +
    (e.mult + (level - 1) * .14).toFixed(2).replace('.',',') + ' × Công Kích' + (e.status ? ' · ' + skillStatus[e.status] : '');
  return Object.keys(e).map(key => skillLabels[key] + ' ' + (e[key] >= 0 ? '+' : '') +
    learnedEffect(skill,key,level)).join(' · ');
}

let skillFilter = 'core';

        () => showMenu('art:' + skill.id)),skill.grade));

  options.push(linkChoice(pavilion ? 'Về Tàng Kinh Các' : 'Về Nhân Vật','',() => showMenu(pavilion ? 'pavilion' : 'profile')));

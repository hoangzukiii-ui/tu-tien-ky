function learnArt(id) {
  if (!state.skillBook[id]) {
    state.skillBook[id] = 1;
    note('Ngươi lĩnh hội ' + skills[id].name + '.', 'good');
  } else state.insightPoints += 2;
}

function artMenu(skill) {
  const level = state.skillBook[skill.id];
  const loadout = state.skillLoadout[skill.type];
  const equipped = loadout.includes(skill.id);
  const required = skillSlots[skill.type][1];
  const cost = (2 + skill.grade) * level;
  return [skill.name,skillGrades[skill.grade] + ' · ' + masteryNames[level - 1] + ' · ' + skill.element + ' · ' + skillText(skill,level),[
    rerender(equipped ? 'Gỡ khỏi ô trang bị' : 'Trang bị',equipped ? '' : loadout.length >= required && required > 1 ?
      'Các ô đã đầy. Hãy gỡ một kỹ năng đang dùng.' : 'Yêu cầu ' + realms[skill.realm].name + '.',() => {
      if (equipped) loadout.splice(loadout.indexOf(skill.id),1);
      else if (required === 1) state.skillLoadout[skill.type] = [skill.id];
      else loadout.push(skill.id);
    },equipped || (state.realm >= skill.realm && (required === 1 || loadout.length < required))),
    rerender('Lĩnh ngộ cấp kế tiếp',level < 5 ? cost + ' điểm · ' + skillText(skill,level + 1) : 'Đã đạt Xuất Thần Nhập Hóa.',() => {
      state.insightPoints -= cost;
      state.skillBook[skill.id]++;
      note('Ngươi đạt ' + masteryNames[level] + ' với ' + skill.name + '.', 'good');
    },level < 5 && state.insightPoints >= cost),
    linkChoice('Về Công Pháp & Võ Kỹ','',() => showMenu('skills'))
  ]];
}

function startFight(kind,name,level,context = {}) {
  const strength = Math.max(0,level);
  const hp = 24 + strength * 21 + (kind === 'duel' ? 9 : 0);
  const npc = state.npcs.find(person => person.id === context.npc);
  const enemy = npc && kind !== 'spar' ? cultivatorStats(npc) :
    {name,hp,max:hp,mp:16 + strength * 8,maxMp:16 + strength * 8,atk:8 + strength * 6,def:3 + strength * 3,
      agi:12 + strength * 6,crit:5 + strength * 2,critDmg:150,element:pick(['Kim','Mộc','Thủy','Hỏa','Thổ'])};
  state.pending = {type:'fight',kind,context,enemy,turn:1,revived:false,cooldowns:{},
    burn:0,slow:0,evade:0,log:[]};
  combatNote(state.pending,'Ngươi bước vào trận với ' + name + '.');
  if (context.opening) {
    const damage = calculateCombatDamage(battleStats(),enemy,context.opening,rootElement(state.root));
    enemy.hp = Math.max(1,enemy.hp - damage);
    combatNote(state.pending,'Đòn mở trận 1,5 lần gây ' + damage + ' sát thương.');
  }
}

function rootElement(root = '') {
  return ['Hỗn Độn','Lôi','Băng','Phong','Ám','Kim','Mộc','Thổ','Thủy','Hỏa'].find(element => root.includes(element)) || '';
}

function calculateCombatDamage(attacker,defender,skill = 1,element = '',crit = false,bonus = 1,pierce = 0) {
  const counters = {Kim:'Mộc',Mộc:'Thổ',Thổ:'Thủy',Thủy:'Hỏa',Hỏa:'Kim'};
  const counter = !defender.immune && counters[element] === defender.element && Boolean(defender.element) ? 1.2 : 1;
  const rawPierce = ['Lôi','Băng','Hỗn Độn'].includes(element) ? .15 : 0;
  const defense = defender.def * .65 * (1 - Math.min(.9,rawPierce + pierce));
  return Math.max(1,Math.round((attacker.atk * skill - defense) * counter * bonus * (crit ? attacker.critDmg / 100 : 1)));
}

const dodgeOdds = (defender,attacker) => clamp((defender - attacker) * .5,2,45);

function combatNote(fight,message,tone = '') {
  fight.log.push(message);
  note(message,tone);
}

function escapeOdds(fight,bonus = 0) {
  return clamp(35 + (battleStats().agi - fight.enemy.agi) * 2 + art('escape') + bonus,8,90);
}

function enemyTurn(fight) {
  const s = battleStats();
  const dodge = clamp(dodgeOdds(s.agi,fight.enemy.agi) + art('dodge') + fight.evade,2,45);
  fight.evade = 0;
  if (die(1,100) <= dodge) {
    combatNote(fight,'Ngươi nghiêng người né đòn phản kích.');
    return;
  }
  const enemy = fight.enemy;
  const cast = Number.isFinite(enemy.mp) && enemy.mp >= 6;
  if (cast) enemy.mp -= 6;
  else if (Number.isFinite(enemy.mp)) enemy.mp = Math.min(enemy.maxMp,enemy.mp + Math.ceil(enemy.maxMp * .1));
  const critical = die(1,100) <= (enemy.crit || 0);
  const damage = calculateCombatDamage(enemy,{...s,element:rootElement(state.root),immune:state.physique === 'chaos'},
    cast ? 1.35 : 1,enemy.element,critical);
  const received = fight.shield ? Math.ceil(damage / 2) : damage;
  const spar = fight.kind === 'spar';
  apply({health:-Math.min(received,spar ? Math.max(0,state.health - 1) : received)});
  fight.shield = false;
  combatNote(fight,fight.enemy.name + ' phản kích, ngươi chịu ' + received + ' sát thương' + (critical ? ' bạo kích!' : '.'),'danger');
  if (!state.health && !fight.revived && art('revive')) {
    fight.revived = true;
    apply({health:Math.ceil(maxHealth() * .22)});
    combatNote(fight,'Nhất Niệm Hồi Sinh giữ lại một tia sinh cơ.','good');
  }
}

function settleFight(fight,result) {
  if (state.pending !== fight) return;
  const won = result === 'win';
  const {kind,context} = fight;
  if (won && ['encounter','duel'].includes(kind) && context.npc) {
    state.pending = {type:'fightOutcome',npc:context.npc,kind};
    finish();
    return;
  }
  state.pending = null;
  note(won ? 'Ngươi thắng trận với ' + fight.enemy.name + '.' :
    result === 'escape' ? 'Ngươi thoát khỏi vòng giao chiến.' : 'Ngươi rời trận trong thế bại.',won ? 'good' : 'danger');
  if (won) {
    state.insightPoints += 2;
    apply({mana:art('drain')});
    if (kind === 'tournament') {
      apply({contribution:28 + state.rank * 8,reputation:17,stones:32});
      achievement('Thắng Tông Môn Đại Bỉ');
    } else if (kind === 'spar') {
      const npc = state.npcs.find(person => person.id === context.npc);
      if (npc) affinity(npc,npc.personality === 'Kiêu Ngạo' ? 5 : 13);
      state.insightPoints += 2;
    } else if (kind === 'beast') {
      apply({stones:state.sectId === 'star' ? 55 : 32,manuals:1,qi:15});
      rewardMaterials(materialTier(),'beast');
      if (activeWorld() === 'ancient') rewardMaterials(materialTier());
      achievement('Hạ yêu thú Bí Cảnh Vân Mộng');
    } else {
      apply({stones:activeWorld() === 'invasion' ? 42 : 24,luck:4});
      if (context.saga) state.sagaHistory.push({id:context.saga,age:state.age,result:'Thắng trận'});
    }
  } else if (kind === 'tournament') apply({reputation:5});
  if (context.saga && !won) state.sagaHistory.push({id:context.saga,age:state.age,result:result === 'escape' ? 'Thoát thân' : 'Bại trận'});
  finish();
}

function takeTurn(fight,move,payload) {
  if (state.pending !== fight) return;
  if (move === 'escape') {
    if (fight.kind === 'tournament') return;
    if (die(1,100) <= escapeOdds(fight)) return settleFight(fight,'escape');
    combatNote(fight,'Đối thủ chặn lối thoát.','danger');
    enemyTurn(fight);
  } else {
    const s = battleStats();
    const skill = move === 'skill' ? skills[payload] : null;
    if (skill && (state.mana < skill.effect.cost || fight.cooldowns[payload] > fight.turn)) return;
    const enemyFirst = fight.enemy.agi - (fight.slow ? 10 : 0) > s.agi && move !== 'shield';
    if (enemyFirst) enemyTurn(fight);
    if (!state.health) return settleFight(fight,'loss');
    let freeze = false;
    if (move === 'shield') {
      if (!state.ward) return;
      apply({ward:-1});
      fight.shield = true;
      combatNote(fight,'Hộ Kiếp Phù dựng lá chắn, giảm một nửa sát thương đòn kế.');
    } else if (move === 'pill') {
      if (payload === 'legacy') apply({pills:-1,health:22,heart:5});
      else consumePill(...payload);
      combatNote(fight,'Ngươi lùi nửa bước để vận hóa dược lực.');
    } else {
      const e = skill?.effect || {};
      const level = skill ? state.skillBook[payload] : 1;
      if (skill) {
        apply({mana:-e.cost});
        fight.cooldowns[payload] = fight.turn + 1 + e.cd;
      }
      if (!skill) apply({mana:Math.ceil(manaMax() * .1)});
      const evasion = dodgeOdds(fight.enemy.agi - (fight.slow ? 10 : 0),s.agi);
      if (die(1,100) <= evasion) combatNote(fight,fight.enemy.name + ' tránh được ' + (skill?.name || 'đòn đánh') + '.');
      else {
        const critical = die(1,100) <= s.crit;
        const core = skills[state.skillLoadout.core[0]];
        const affinity = 1 + (skill && state.root.includes(skill.element) ? .12 : 0) +
          (skill && core?.element === skill.element ? .08 : 0);
        const weapon = activeGear('main');
        const element = skill?.element || rootElement(state.root);
        const physique = 1 + (weapon?.type === 'sword' || skill?.id === 'windcut' || skill?.id === 'swords' ? body('sword') : 0) +
          (element === 'Băng' ? body('ice') : element === 'Hỏa' ? body('fire') : 0);
        const damage = calculateCombatDamage(s,fight.enemy,(e.mult || 1) + (level - 1) * .14,element,
          critical,affinity * physique,(e.status === 'pierce' ? .5 : 0) + gearTotal('pierce') / 100);
        fight.enemy.hp = Math.max(0,fight.enemy.hp - damage);
        combatNote(fight,'Ngươi ' + (skill ? 'thi triển ' + skill.name : 'ra đòn') +
          (weapon ? ' bằng ' + gearName(weapon) : '') + ', gây ' + damage + ' sát thương' + (critical ? ' bạo kích!' : '.'),'good');
        apply({health:Math.floor(damage * gearTotal('leech') / 100)});
        if (e.status === 'burn') fight.burn = 2;
        if (e.status === 'slow') fight.slow = 2;
        freeze = e.status === 'freeze';
      }
      if (e.status === 'heal') apply({health:8 + level * 4});
      if (e.status === 'evade') fight.evade = 24;
      if (e.status === 'flight' && fight.kind !== 'tournament' &&
        fight.enemy.hp && die(1,100) <= escapeOdds(fight,30)) return settleFight(fight,'escape');
    }
    if (fight.burn && fight.enemy.hp) {
      const damage = 3 + state.realm;
      fight.enemy.hp = Math.max(0,fight.enemy.hp - damage);
      fight.burn--;
      combatNote(fight,'Hỏa kình thiêu đốt đối thủ, gây ' + damage + ' sát thương.');
    }
    if (!fight.enemy.hp) return settleFight(fight,'win');
    if (!enemyFirst && !freeze) enemyTurn(fight);
    else if (freeze && !enemyFirst) combatNote(fight,'Hàn khí khóa đòn phản công.');
    if (fight.slow) fight.slow--;
  }
  if (!state.health) return settleFight(fight,'loss');
  if (['tournament','spar'].includes(fight.kind) && state.health <= Math.ceil(maxHealth() * .15)) return settleFight(fight,'loss');
  fight.turn++;
  finish();
}

function fightMenu(fight) {
  const panel = textElement('div','','work-card');
  const timeline = textElement('div','','combat-log');
  timeline.setAttribute('role','log');
  const conditions = [fight.burn ? 'Thiêu đốt ' + fight.burn + ' lượt' : '',
    fight.slow ? 'Địch bị chậm ' + fight.slow + ' lượt' : '',
    state.battleTurns ? 'Đan dược tăng chiến lực còn ' + state.battleTurns + ' năm' : ''].filter(Boolean);
  if (conditions.length) panel.append(textElement('p',conditions.join(' · '),'intro'));
  for (const message of fight.log.slice(-5)) timeline.append(textElement('p',message));
  panel.append(timeline);
  const s = battleStats();
  const e = fight.enemy;
  const row = data => 'Công ' + data.atk + ' · Thủ ' + data.def + ' · Thân Pháp ' + data.agi +
    ' · Bạo Kích ' + (data.crit || 0) + '% / ' + (data.critDmg || 150) + '%.';
  panel.append(textElement('p','Ngươi · ' + row(s)),textElement('p','Địch · Linh Lực ' + (e.mp ?? 0) + ' / ' +
    (e.maxMp ?? 0) + ' · ' + row(e)));
  const math = textElement('details','','work-card');
  math.append(textElement('summary','Công thức lượt đấu'),textElement('p','Thân Pháp cao ra tay trước. Né = (Thân Pháp thủ − công) × 0,5%, giới hạn 2–45%. Sát thương = làm tròn [(Công × hệ số chiêu − Thủ × 0,65 sau xuyên giáp) × tương khắc × bạo kích × trợ lực], tối thiểu 1. Khắc hệ +20%. Lôi, Băng, Hỗn Độn xuyên 15% thủ.'));
  panel.append(math);
  for (const [label,current,max,color] of [['Khí Huyết địch',e.hp,e.max,'#a63f42'],
    ['Linh Lực địch',e.mp ?? 0,e.maxMp || 1,'#4a6587'],['Khí Huyết của ngươi',state.health,maxHealth(),'#a63f42'],
    ['Linh Lực của ngươi',state.mana,manaMax(),'#4a6587']]) {
    const bar = textElement('div','','track');
    bar.append(document.createElement('i'));
    bar.setAttribute('role','progressbar');
    bar.setAttribute('aria-label',label);
    bar.style.setProperty('--fill',color);
    setBar(bar,current,max);
    panel.append(textElement('p',label + ' · ' + current + ' / ' + max,'resource-line'),bar);
  }
  const choices = [linkChoice('Đánh Thường','Hệ số 1,0 · hồi 10% linh lực tối đa.',() => takeTurn(fight,'normal'))];
  for (const id of state.skillLoadout.active) {
    const skill = skills[id];
    const wait = Math.max(0,(fight.cooldowns[id] || 0) - fight.turn);
    choices.push(graded(linkChoice(skill.name,skillText(skill,state.skillBook[id]) + (wait ? ' · Còn ' + wait + ' lượt hồi.' : ''),
      () => takeTurn(fight,'skill',id),!wait && state.mana >= skill.effect.cost),skill.grade));
  }
  choices.push(linkChoice('Dùng Đan Dược','Chọn đan trong túi; sử dụng sẽ mất một lượt.',() => {
    const pills = [];
    if (state.pills) pills.push(linkChoice('Hồi Xuân Đan ×' + state.pills,'Hồi 22 khí huyết, 5 đạo tâm.',
      () => takeTurn(fight,'pill','legacy')));
    for (const [key,count] of Object.entries(state.pillStock)) if (count) {
      const [id,value] = key.split(':');
      const grade = Number(value);
      const formula = formulas.find(entry => entry[0] === id);
      pills.push(graded(linkChoice(formula[1] + ' ×' + count,quality[grade] + ' · ' +
        (grade ? formula[3] : 'Hồi 3 tu vi, tăng 9 đan độc.'),() => takeTurn(fight,'pill',[id,grade])),grade));
    }
    pills.push(linkChoice('Về giao chiến','',() => showSheet(...fightMenu(fight))));
    showSheet('Dùng Đan Dược','Linh lực ' + state.mana + ' / ' + manaMax(),pills,true);
  },Boolean(state.pills || Object.values(state.pillStock).some(Boolean))));
  choices.push(linkChoice('Bỏ Chạy',fight.kind === 'tournament' ? 'Quy củ Đại Bỉ yêu cầu phân thắng bại trên đài.' :
    'Cơ hội thoát ' + escapeOdds(fight) + '%.',() => takeTurn(fight,'escape'),fight.kind !== 'tournament'));
  if (state.ward) choices.push(linkChoice('Dùng Pháp Bảo Hộ Thân','Tiêu một Hộ Kiếp Phù, giảm nửa sát thương đòn kế.',
    () => takeTurn(fight,'shield')));
  return [fight.enemy.name,'Lượt ' + fight.turn + ' · Địch ' + fight.enemy.hp + ' / ' + fight.enemy.max +
    ' · Khí Huyết ' + state.health + ' / ' + maxHealth() + ' · Linh Lực ' + state.mana + ' / ' + manaMax(),choices,true,panel];
}

function activeWorld() {
  return state.worldEffect?.id || '';
}

function expireWorld() {
  if (state.worldEffect && state.worldEffect.until <= state.age) {
    note('✦ ' + worldStories.find(row => row[0] === state.worldEffect.id)[1] + ' đã kết thúc.','world');
    state.worldEffect = null;
  }
}

function openDueStory() {
  const due = state.delayed.reduce((best,thread,index) => thread.due <= state.age &&
    (best < 0 || thread.due < state.delayed[best].due) ? index : best,-1);
  if (due < 0) return false;
  const [thread] = state.delayed.splice(due,1);
  state.pending = {...thread,type:thread.special === 'causal' ? 'causal' : thread.special === 'saga' ? 'sagaFollowup' : 'followup'};
  return true;
}

function yearlySaga() {
  if (state.age >= state.worldNext) {
    const event = EventDirector.select(WORLD_EVENTS);
    if (!event) return false;
    EventDirector.note(event);
    state.pending = {type:'worldStory',id:event.id};
    state.worldNext = state.age + die(20,50);
    return true;
  }
  return false;
}

const sagaGroup = index => index < 12 ? 0 : index < 28 ? 1 : index < 42 ? 2 : 3;

function sagaMenu(pending) {
  const row = episodes.find(entry => entry[0] === pending.id);
  const [id,title,prompt,first,second,third] = row;
  const group = sagaGroup(episodes.indexOf(row));
  const agile = agileEpisodes.has(id);
  const paid = id === 'blackbox' || id === 'mask';
  const heartCheck = group === 3 && !agile;
  const check = agile ? battleStats().agi : heartCheck ? state.heart + art('mind') : state.insight;
  const threshold = agile ? 35 + group * 4 : 52 + group * 3;
  const groupEffects = [{heart:5,karma:5},{luck:4,stones:8},{reputation:6,contribution:8},{heart:8,mana:8}];
  const choices = [
    [first,'',groupEffects[group],true],
    [second,paid ? 'Tốn 18 linh thạch.' : '',paid ? {stones:-18,manuals:1} :
      group === 3 ? {heart:10,qi:6} : {insight:3,stones:6},!paid || state.stones >= 18],
    [third,'[' + (agile ? 'Thân Pháp' : heartCheck ? 'Đạo Tâm + kháng Tâm Ma' : 'Ngộ Tính') +
      ' ≥ ' + threshold + '] · Hiện có ' + check + '.',
      {qi:agile ? 6 : 13,luck:agile ? 6 : 3},check >= threshold]
  ];
  if (boldEpisodes.has(id)) choices.push(['Cưỡng lấy vật đang tranh','[Ma Tính ≥ 40] · Có thể dẫn tới giao chiến.',
    {stones:32,karma:-14},state.karma <= -40]);
  return [title,sagaGroups[group] + ' · ' + prompt,choices.map(([label,hint,changes,ready],index) =>
    linkChoice(label,hint,() => {
      state.pending = null;
      state.sagaSeen.push(id);
      state.sagaHistory.push({id,age:state.age,result:label});
      apply(scaleNarrative(changes));
      note(title + ' · Ngươi chọn ' + label.toLocaleLowerCase('vi') + '.',index === 3 ? 'danger' : 'good');
      const cause = sagaCauses[id];
      if (cause) {
        const flag = id === 'fox' && index === 2 ? 'followedFoxTrapper' :
          id === 'noble' && index !== 0 ? 'rememberedYoungMaster' : cause[0];
        recordCause(flag,index,cause[1],cause[2]);
      }
      if (index === 2 && (id === 'fallen' || id === 'archive' || id === 'regret')) {
        learnArt(id === 'fallen' ? 'thrust' : id === 'archive' ? 'intent' : 'lotus');
      }
      if (index === 0 && id === 'fox') apply({pet:state.pet ? 0 : 1});
      if (index === 1 && id === 'dry') rewardMaterials(materialTier());
      if (index === 3 || (index === 1 && id === 'thunderDust')) {
        startFight('ambush','Kẻ Chặn Đường',Math.max(0,state.realm - 1),{saga:id});
      }
      finish();
    },ready)),true];
}

function sagaFollowup(thread) {
  const [id,title,,first,second,third] = episodes.find(entry => entry[0] === thread.saga);
  const branch = thread.branch;
  const callback = branch === 0 ? first : branch === 1 ? second : branch === 2 ? third : 'Cưỡng lấy vật đang tranh';
  const [firstReturn,laterReturn,investigate] = callbacks[id];
  const prompt = branch === 0 ? firstReturn :
    branch === 3 ? 'Người từng bị đoạt mất cơ duyên lần theo dấu vết và chặn ngươi ở cửa núi.' :
      laterReturn;
  const answers = branch === 3 ? [
    ['Trả 24 linh thạch để dứt oán',{stones:-24,karma:12},state.stones >= 24],
    ['Nhận lời quyết đấu',{},true],
    ['Buông vật cũ rồi xuống núi',{heart:-4,karma:5},true]
  ] : [
    [branch === 0 ? 'Nhận lễ đáp nghĩa' : 'Kể lại đầu đuôi',{stones:branch === 0 ? 32 : 12,heart:6},true],
    [investigate,{qi:18,insight:4},true],
    ['Trao phần lợi cho người đến sau',{karma:14,luck:3},true]
  ];
  return ['Hồi sau · ' + title,'Năm ấy ngươi chọn “' + callback + '”. ' + prompt,answers.map(([label,effect,ready],index) =>
    linkChoice(label,'',() => {
      state.pending = null;
      apply(effect);
      state.sagaHistory.push({id,age:state.age,result:label,followup:true});
      note('Hồi sau · ' + title + ' · ' + label + '.','good');
      if (branch === 3 && index === 1) startFight('ambush','Oan Gia Năm Cũ',state.realm,{saga:id});
      finish();
    },ready)),true];
}

function summaryDetails(snapshot = state) {
  const panel = textElement('div','','scroll');
  const core = snapshot.skillLoadout.core[0];
  panel.append(textElement('p','Tổng Chiến Lực ' + number(snapshot.score ?? power()) + ' · Nghiệp Lực ' + snapshot.karma),
    textElement('p','Tâm pháp: ' + (core ? skills[core].name : 'Chưa lập chủ tu') + '.'));
  const best = Object.entries(snapshot.skillBook).filter(([,level]) => level >= 3)
    .sort((a,b) => b[1] - a[1]).slice(0,5);
  if (best.length) panel.append(textElement('p','Võ học thành danh: ' +
    best.map(([id,level]) => skills[id].name + ' · ' + masteryNames[level - 1]).join(', ') + '.'));
  const moments = snapshot.sagaHistory.slice(-6);
  if (moments.length) {
    const list = document.createElement('ul');
    for (const moment of moments) {
      const title = [...episodes,...worldStories].find(row => row[0] === moment.id)?.[1];
      if (title) list.append(textElement('li','Tuổi ' + moment.age + ' · ' + title + ' · ' + moment.result));
    }
    panel.append(list);
  }
  return panel;
}

  ],required,summaryDetails(record)];
}

const physiqueGrades = ['Phàm Phẩm','Linh Phẩm','Vương Phẩm','Thánh Phẩm','Hỗn Độn Phẩm'];
const awakeningNames = ['Sơ Kỳ','Tiểu Thành','Đại Thành','Viên Mãn'];
const physiques = {
  mortal:['Phàm Thai Nhục Thể',0,'Thân phàm, nền tảng bình thường.',{}],
  antidote:['Bách Độc Bất Xâm Thể',1,'Kinh mạch lọc độc dược.',{toxin:.8}],
  channel:['Thiên Linh Mạch',1,'Linh mạch tự đón khí trời đất.',{qi:.25}],
  pure:['Xích Tử Chi Tâm',1,'Tâm sáng, khó nhiễm vọng niệm cấp thấp.',{insight:.3}],
  blade:['Kiếm Linh Chi Thể',2,'Thân cộng hưởng với kiếm ý, tăng sát thương phi kiếm và lĩnh ngộ kiếm pháp.',{sword:.4}],
  yin:['Chí Âm Huyền Thể',2,'Băng tức nuôi kinh mạch, hợp với chân dương.',{ice:.5,beauty:20}],
  yang:['Chí Dương Viêm Thể',2,'Chân hỏa hộ thân, hợp với thuần âm.',{fire:.5}],
  adamant:['Bất Diệt Kim Thân',2,'Xương thịt cứng như kim tinh.',{hp:.45,def:.45}],
  ancient:['Hoang Cổ Thánh Thể',3,'Công và khí huyết mạnh, chống lôi tốt. Đại cảnh cần 1,5 lần tu vi và cống phí linh thạch.',{atk:.6,hp:.6,storm:.4}],
  embryo:['Tiên Thiên Đạo Thai',3,'Thiên địa ứng niệm, lợi cho ngộ đạo, trận pháp và luyện đan.',{insight:.8,qi:.5,alchemy:22,beauty:25}],
  tyrant:['Thương Thiên Bá Thể',3,'Bá khí ép người, tăng công kích và sát thương bạo kích.',{atk:.75,critDmg:75}],
  chaos:['Hỗn Độn Thần Ma Thể',4,'Thể chất toàn diện và tu nhanh, dẫn tới Cửu Tiêu Thần Lôi.',{atk:.8,def:.8,hp:.8,agi:.8,crit:.8,qi:1}],
  samsara:['Luân Hồi Tiên Thể',4,'Giữ 20% ngộ tính gốc và một võ học của kiếp trước. Trọn thiên phú thêm 50 năm thọ nguyên.',{life:50}]
};

function weightedPick(pool,weight) {
  const weights = pool.map(weight);
  let roll = Math.random() * weights.reduce((sum,value) => sum + value,0);
  return pool.find((_,index) => (roll -= weights[index]) < 0) || pool.at(-1);
}

function rollPhysique() {
  const tier = weightedPick([0,1,2,3,4],index => [65,20,10,4,1][index]);
  return pick(Object.keys(physiques).filter(id => physiques[id][1] === tier));
}
const physiqueName = (id = state.physique) => (physiques[id] || physiques.mortal)[0];
const body = key => (physiques[state.physique]?.[3][key] || 0) * [.1,.35,.65,1][state.awakening];
const beauty = () => clamp(Math.round(state.beauty + body('beauty')),0,100);
const marketPrice = amount => Math.ceil(amount * (beauty() >= 80 ? .9 : 1));
const comprehension = () => Math.round(state.insight * (1 + body('insight')));
const isMajor = (realm,step) => step === realms[realm].stages.length - 1;

function stageTarget(realm,step) {
  const base = realms[realm].base || 0;
  const scale = state.physique === 'ancient' && isMajor(realm,step) ? 1.5 : 1;
  return Math.ceil((base + step * (realm === 1 ? 4 : 13)) * scale);
}

function upgradeDestiny() {
  if (state.destinyVersion === 1) return;
  Object.assign(state,{destinyVersion:1,physique:state.physique || 'mortal',awakening:state.awakening || 0,
    beauty:state.beauty ?? clamp(45 + state.charm,10,95),rerolled:state.rerolled || false,
    eventMemory:{},eventHistory:{},children:[],sharedVault:{},familyFoes:{},sworn:[],cultivationRetreat:0});
  for (const npc of state.npcs) initializeNpc(npc);
}

function fateReveal() {
  const pending = state.pending;
  if (pending.revealed) {
    const card = textElement('div','','scroll');
    for (const line of [state.name + ' · ' + state.sex,state.background,state.root,physiqueName(),
      'Dung Mạo ' + beauty() + ' / 100',state.talents.join(' · ')]) card.append(textElement('p',line));
    return ['Thiên Mệnh Đã Định','Ký lục đầu đời',[
      linkChoice('Vào kiếp này','',() => {state.pending = null;finish();$('advance').focus();})
    ],true,card];
  }
  const card = textElement('div','✧ Luân Hồi Bàn đang chuyển ✧','scroll destiny-wheel');
  setTimeout(() => {
    if (state.pending !== pending) return;
    pending.revealed = true;
    finish();
  },1500);
  return ['Luân Hồi Bàn','Thiên mệnh đang hiện rõ.',[],true,card];
}

function requestAwakening() {
  const needed = ['tienchi','hoanthon','batTu'][state.awakening];
  if (state.physique === 'mortal') return ['Thể Chất & Huyết Mạch',physiqueName() + ' · ' + physiques.mortal[2],[
    linkChoice('Về Nhân Vật','',() => showMenu('profile'))
  ]];
  return ['Thức Tỉnh Thể Chất',physiqueName() + ' · ' + awakeningNames[state.awakening] + ' · ' +
    [10,35,65,100][state.awakening] + '% hiệu lực. ' + physiques[state.physique][2],[
    rerender(needed ? 'Dùng ' + herbName(needed) : 'Đã viên mãn',needed ? 'Tiêu hao một thiên tài địa bảo.' : '',() => {
      if (chargeMaterials([needed])) awakenBody();
    },Boolean(needed) && state.physique !== 'mortal' && owned(needed) > 0),
    linkChoice('Về Nhân Vật','',() => showMenu('profile'))
  ]];
}

function awakenBody() {
  if (state.physique === 'mortal' || state.awakening >= 3) return;
  state.awakening++;
  note(physiqueName() + ' thức tỉnh đến ' + awakeningNames[state.awakening] + '.','sacred');
}

function calculateYearlyQi() {
  const base = 6 + state.realm * 6 + state.step;
  const root = state.aptitude + state.purity;
  const insight = 1 + comprehension() / 100;
  const method = 1 + (art('gain') + state.manualLevel * 2 + state.cultivation + gearTotal('qi') +
    Math.min(4,Math.floor(state.mentor / 5)) + (state.sectId === 'blood' ? 5 : 0)) / 25;
  const physique = (1 + body('qi')) * (state.talents.includes('Thiên Đố Anh Tài') ? 2 : 1);
  const environment = state.cultivationRetreat > 0 ? 2.2 : state.sectId ? state.rank >= 2 ? 1.6 : 1.2 : .8;
  const weather = activeWorld() === 'surge' ? 2 : activeWorld() === 'scarcity' ? .75 : 1;
  const toxin = Math.max(.65,1 - state.toxin * .004);
  return {base,root,insight,method,physique,environment,weather,toxin,
    gain:Math.floor(base * root * insight * method * physique * environment * weather * toxin)};
}

function breakthroughFactors() {
  const factors = [52,comprehension() * .35,state.heart * .14,state.manualLevel * 2,state.breakBoost,art('mind') / 2];
  return {factors,chance:clamp(factors.reduce((a,b) => a + b,0),55,98)};
}

function cultivationMenu() {
  const {gain,...factors} = calculateYearlyQi();
  const names = ['Cảnh giới','Linh căn và độ tinh khiết','Ngộ tính','Tâm pháp, tông môn và trợ lực','Thể chất và thiên phú',
    'Môi trường','Thế cuộc','Đan độc'];
  const panel = textElement('div','','scroll');
  Object.values(factors).forEach((value,index) => panel.append(textElement('p',names[index] + ' · ' +
    (index ? '×' : '') + value.toLocaleString('vi-VN',{maximumFractionDigits:3}))));
  const {chance,factors:odds} = breakthroughFactors();
  panel.append(textElement('p',isMajor(state.realm,state.step) ? 'Đại cảnh phân định bằng các đạo thiên lôi. Xem mức kháng và tài nguyên trong lôi kiếp.' :
    'Đột phá tầng: ' + chance.toFixed(1) + '% · gốc, ngộ tính, đạo tâm, kinh thư, đan dược, hộ tâm lần lượt: ' +
    odds.map(value => value.toFixed(1)).join(' + ') + ' · giới hạn 55–98%.'));
  const guide = textElement('details','','work-card');
  guide.append(textElement('summary','Tu Vi cần cho từng bình cảnh'));
  realms.forEach((realm,index) => {
    if (!realm.base) return;
    guide.append(textElement('p',realm.name + ' · ' + realm.stages.map((name,step) =>
      (name || 'Nhập đạo') + ' ' + stageTarget(index,step)).join(' · ')));
  });
  panel.append(guide);
  if (isMajor(state.realm,state.step) && target()) panel.append(textElement('p','Vận công trước đạo lôi thứ nhất: ' +
    lightningForecast({strike:1}) + (state.physique === 'ancient' ?
      ' Phí dẫn lôi: ' + Math.ceil((state.realm + 1) * 18 * 1.5) + ' linh thạch.' : '')));
  return ['Chi Tiết Tu Luyện','+' + number(gain) + ' Tu Vi / năm · làm tròn xuống sau khi nhân các hệ số.',[],false,panel];
}

function initializeNpc(npc) {
  if (npc.goods) return npc;
  npc.sex ??= pick(['Nam','Nữ']);
  npc.sect ??= npc.origin.includes('Đồng môn') || npc.role === 'master' ? state.sectId : pick(['','',...sects.map(sect => sect.id)]);
  npc.physique ??= rollPhysique();
  npc.beauty ??= die(10,95);
  npc.insight ??= die(28,89);
  npc.karma ??= die(-80,80);
  npc.goods = {stones:die(12,28) * (npc.realm + 1),herb:pick(herbs.filter(row => row[2] <= Math.max(1,npc.realm)))[0],
    weapon:pick(['Thanh Trúc Kiếm','Lưu Vân Đao','Tàng Phong Trượng','Bạch Ngọc Chung'])};
  npc.memory = [];
  return npc;
}

function seedFamily() {
  const rolesAtBirth = ['Ăn Mày Đầu Đường','Tán Tu Cô Nhi'].includes(state.background) ?
    [['parent','Người nuôi dưỡng']] : [['parent','Thân phụ'],['parent','Thân mẫu'],['sibling','Anh chị trong nhà']];
  for (const [role,origin] of rolesAtBirth) {
    const npc = createNpc(role,origin,30);
    npc.age = role === 'parent' ? die(22,43) : die(2,8);
    npc.realm = state.background.includes('Tu Chân') ? 1 : 0;
  }
}

function simulateNpc(npc) {
  if (npc.lost) return;
  npc.age++;
  const life = realms[npc.realm].life;
  const roll = die(1,100);
  if (npc.age >= life || (roll === 1 && npc.role === 'rival')) {
    npc.lost = true;
    if (state.masterId === npc.id) {state.masterId = 0;state.mentor = 0;}
    if (state.partnerId === npc.id) {state.partnerId = 0;state.bond = 0;}
    note(npc.name + (npc.age >= life ? ' đã tọa hóa khi thọ nguyên cạn.' : ' mất mạng trong chuyến qua Hắc Phong Cốc.'),'danger');
  } else if ((roll <= 3 || (npc.training || 0) >= 70) && npc.realm < 7 && npc.age >= 10) {
    npc.realm++;
    npc.training = 0;
    note(npc.name + ' đã đột phá ' + realms[npc.realm].name + '.','good');
  } else if (roll === 4 && !npc.sect && npc.realm) {
    const sect = pick(sects);
    npc.sect = sect.id;
    note(npc.name + ' bái nhập ' + sect.name + '.');
  } else if (roll === 5 && npc.age >= 18 && !npc.married && npc.id !== state.partnerId) {
    npc.married = true;
    note(npc.name + ' gửi thiệp báo tin thành hôn.');
  } else if (roll === 6) {
    npc.injured = true;
    note(npc.name + ' bị thương trên đường qua đèo.');
  }
  if (!npc.lost && state.sworn.includes(npc.id) && state.health < maxHealth() * .35 && !state.actions.swornHelp) {
    state.actions.swornHelp = true;
    apply({health:22,stones:12});
    note(npc.name + ' đưa ngươi đến nơi an toàn và để lại linh thạch.','good');
  } else if (!npc.lost && roll === 7 && state.sworn.includes(npc.id)) {
    const gift = Math.min(npc.goods.stones,scaledStones(8));
    npc.goods.stones -= gift;
    if (gift) {apply({stones:gift});note(npc.name + ' gửi ' + number(gift) + ' linh thạch từ xa.','good');}
  }
}

function charmOdds(npc) {
  return clamp(Math.round(25 + beauty() * .3 + npc.affinity * .35 + state.charm +
    (beauty() >= 80 ? 40 : 0)),8,98);
}

function npcRecord(npc,deed) {
  npc.memory.push({deed,age:state.age});
  if (npc.memory.length > 30) npc.memory.shift();
}

function giftMenu(npc) {
  const options = [];
  const give = (label,hint,consume,amount,ready = true) => options.push(rerender(label,hint,() => {
    consume();
    state.actions['gift:' + npc.id] = true;
    affinity(npc,amount);
    npcRecord(npc,label);
    note(npc.name + ' nhận lễ. Hảo cảm ' + npc.affinity + '.','good');
  },ready && !state.actions['gift:' + npc.id]));
  give('Tặng 18 Linh Thạch','Người hám lợi quý linh thạch hơn.',() => {apply({stones:-18});npc.goods.stones += 18;},
    npc.personality === 'Hám Lợi' ? 20 : 12,state.stones >= 18);
  for (const [id,name] of herbs) if (owned(id)) give('Tặng ' + name,'Tiêu hao một dược liệu.',() => chargeMaterials([id]),10);
  for (const [key,count] of Object.entries(state.pillStock)) if (count) {
    const [id,grade] = key.split(':');
    const name = formulas.find(formula => formula[0] === id)[1];
    give('Tặng ' + name,quality[grade],() => {
      state.pillStock[key]--;
      if (Number(grade) && ['heal','return','rebirth'].includes(id)) npc.injured = false;
      if (Number(grade) && id === 'foundation') npc.training = (npc.training || 0) + 35;
    },id === 'foundation' && npc.realm < 2 ? 35 :
      npc.injured && ['heal','return'].includes(id) ? 27 : 13);
  }
  for (const item of state.gear.filter(gear => !Object.values(state.equipment).includes(gear.id))) {
    give('Tặng ' + gearName(item),rarity[item.grade],() => {
      state.gear = state.gear.filter(gear => gear.id !== item.id);
      if (state.natalPlan?.id === item.id) state.natalPlan = null;
    },20 + item.grade * 4);
  }
  options.push(linkChoice('Về hồ sơ','',() => showMenu('npc:' + npc.id)));
  return ['Tặng Quà',npc.name + (npc.injured ? ' · Đang bị thương' : ' · ' + npc.personality),options];
}

function familyMenu() {
  const partner = state.npcs.find(npc => npc.id === state.partnerId && !npc.lost);
  const {form,field} = workFields();
  const stash = state.sharedVault.herbs ??= {};
  const candidate = field('Dược liệu trong kho chung',
    [['','Chọn dược liệu'],...herbs.filter(([id]) => owned(id) || stash[id])
      .map(([id,label]) => [id,label + ' · túi ' + owned(id) + ' · chung ' + (stash[id] || 0)])]);
  return ['Động Phủ Gia Đình','Quỹ chung: ' + (state.sharedVault.stones || 0) + ' linh thạch · ' +
    state.children.length + ' người con.',[
    rerender('Gửi 30 linh thạch vào quỹ','Kho chung lưu riêng khỏi túi hành trang.',() => {
      state.sharedVault.stones = (state.sharedVault.stones || 0) + 30;
      apply({stones:-30});
    },Boolean(partner) && state.stones >= 30),
    rerender('Rút 30 linh thạch','Chuyển về túi hành trang.',() => {
      state.sharedVault.stones -= 30;apply({stones:30});
    },state.sharedVault.stones >= 30),
    rerender('Gửi một dược liệu','Chuyển vật đã chọn từ túi vào kho chung.',() => {
      const id = candidate.value;
      if (id && chargeMaterials([id])) stash[id] = (stash[id] || 0) + 1;
    },Boolean(partner)),
    rerender('Rút một dược liệu','Chuyển vật đã chọn từ kho chung về túi.',() => {
      const id = candidate.value;
      if (stash[id] > 0) {stash[id]--;gainMaterial(id);}
    },Object.values(stash).some(Boolean)),
    action('child','Đón con vào gia phả','Cần có đạo lữ. Huyết mạch có thể truyền cho con.',() => {
      const child = createNpc('child','Con của ' + state.name + ' và ' + partner.name,55);
      child.age = 0;child.realm = 0;child.parents = [state.name,partner.id];
      if (die(1,100) <= 35) child.physique = pick([state.physique,partner.physique]);
      state.children.push(child.id);
      note(child.name + ' được ghi vào gia phả · ' + physiqueName(child.physique) + '.','sacred');
    },Boolean(partner) && state.children.length < 6)
  ],false,form];
}

function cultivatorStats(npc) {
  const step = npc.realm * 7;
  const traits = (physiques[npc.physique] || physiques.mortal)[3];
  const growth = Math.min(1,.1 + npc.realm * .13);
  const hp = Math.round((40 + step * 4) * (1 + (traits.hp || 0) * growth));
  const atk = Math.round((10 + step + Math.floor(npc.insight / 12)) * (1 + (traits.atk || 0) * growth));
  const def = Math.round((4 + step * .5) * (1 + (traits.def || 0) * growth));
  const agi = Math.round((14 + step + Math.floor(npc.insight / 10)) * (1 + (traits.agi || 0) * growth));
  const crit = Math.min(75,Math.round((8 + npc.realm * 2) * (1 + (traits.crit || 0) * growth)));
  const critDmg = Math.round(150 + (traits.critDmg || 0) * growth);
  return {name:npc.name,hp,max:hp,mp:20 + step * 2,maxMp:20 + step * 2,atk,def,agi,crit,critDmg,
    immune:npc.physique === 'chaos',element:rootElement(roots[npc.root]?.[0]),
    score:Math.floor(atk * 2 + def * 1.25 + agi + hp * .28 + (20 + step * 2) * .35 + crit * (critDmg - 100) / 100)};
}

function spawnEncounter() {
  const existing = state.npcs.filter(npc => !npc.lost && ['wanderer','rival','peer'].includes(npc.role));
  const npc = existing.length && die(1,100) <= 40 ? pick(existing) :
    createNpc('wanderer',pick(['Tán tu qua đèo','Thiếu chủ du lịch','Ma tu hành tẩu','Tiền bối ẩn danh']),0);
  if (npc.role === 'wanderer' && npc.origin === 'Tiền bối ẩn danh') npc.realm = Math.min(7,Math.max(npc.realm,state.realm + 2));
  if (npc.role === 'wanderer') npc.met ??= false;
  state.pending = {type:'encounter',npc:npc.id};
  note('Trên đường, ngươi gặp ' + npc.name + ' · ' + npc.origin + '.');
}

function encounterMenu(pending) {
  const npc = state.npcs.find(person => person.id === pending.npc);
  const enemy = cultivatorStats(npc);
  const s = battleStats();
  const assess = npc.realm <= state.realm + 1;
  const intimidate = clamp(25 + (state.sectId ? state.rank * 5 : 0) + Math.floor((s.atk - enemy.atk) * 1.3) +
    (beauty() <= 25 ? 25 : 0) + Math.floor(Math.max(0,-state.karma) / 5),5,95);
  const escape = escapeOdds({enemy});
  const friendly = charmOdds(npc);
  const clash = (opening = 0) => startFight('encounter',npc.name,npc.realm,{npc:npc.id,opening});
  return ['Thần Thức Quét Qua',npc.name + ' · ' + realms[npc.realm].name + ' · ' +
    (sects.find(sect => sect.id === npc.sect)?.name || 'Tán tu') + ' · ' + physiqueName(npc.physique) +
    ' · Dung Mạo ' + npc.beauty + ' · Nghiệp Lực ' + npc.karma + ' · ' +
    (assess ? 'Chiến Lực ' + enemy.score + ' · ' + npc.goods.weapon + ' · Túi đồ: ' + npc.goods.stones +
      ' linh thạch, ' + herbName(npc.goods.herb) : 'Khí tức sâu không lường được. Cực kỳ nguy hiểm!'),[
    rerender('Giao Chiến / Cướp Đoạt','Bước vào giao chiến theo lượt.',() => clash()),
    rerender('Kết Giao / Đàm Đạo',friendly + '% · 25 gốc + 0,3 × Dung Mạo + 0,35 × hảo cảm + mị lực · có thưởng khi đạt Dung Mạo 80.',() => {
      state.pending = null;
      const success = die(1,100) <= friendly;
      affinity(npc,success ? 20 : -4);
      if (success) npc.met = true;
      npcRecord(npc,'Đàm đạo trên đường');
      note(success ? npc.name + ' trao tín phù liên lạc.' : npc.name + ' cáo từ sau vài câu chuyện.');
    }),
    rerender('Báo Danh / Uy Hiếp',intimidate + '% · 25 + 5 × bậc phẩm + 1,3 × chênh Công Kích (làm tròn xuống) + ' +
      (beauty() <= 25 ? 25 : 0) + ' uy tướng + ' + Math.floor(Math.max(0,-state.karma) / 5) + ' ma tính · giới hạn 5–95%.',() => {
      apply({karma:-6});
      if (die(1,100) <= intimidate) {
        const paid = Math.min(npc.goods.stones,scaledStones(12));
        npc.goods.stones -= paid;
        apply({stones:paid});
        affinity(npc,-20);
        state.pending = null;
        note(npc.name + ' để lại ' + number(paid) + ' linh thạch rồi đi.','danger');
      } else clash();

class EventDirector {
  static context() {
    const master = masterNpc();
    const companion = partnerNpc();
    const rival = state.npcs.find(npc => npc.role === 'rival' && !npc.lost);
    return {age:state.age,realm:state.realm,role:currentRole(),sect:state.sectId,physique:state.physique,
      stats:{comprehension:comprehension(),luck:state.luck,karma:state.karma,charm:beauty(),atk:battleStats().atk,
        agi:battleStats().agi,heart:state.heart,health:state.health},
      flags:state.eventMemory,world:activeWorld(),master,companion,rival,weapon:activeGear('main'),
      inventory:{stones:state.stones,herbs:state.materials,pills:state.pillStock},skillLoadout:state.skillLoadout,
      sectName:state.sect || 'giang hồ',roleName:state.sect ? ranks[state.rank] : state.realm ? 'Tán Tu' : 'Phàm Nhân',
      masterName:master?.name || 'vị tiền bối',companionName:companion?.name || 'bạn đồng hành',
      rivalName:rival?.name || 'một tu sĩ áo đen',physiqueName:physiqueName(),
      weaponName:activeGear('main') ? gearName(activeGear('main')) : 'tay không'};
  }

  static eligible(event,ctx) {
    const c = event.conditions;
    const history = state.eventHistory[event.id];
    return !(history && (event.oneTime || ctx.age - history.age < event.cooldownYears)) &&
      ctx.age >= (c.minAge ?? 0) && ctx.age <= (c.maxAge ?? Infinity) &&
      ctx.realm >= (c.minRealmIndex ?? 0) && ctx.realm <= (c.maxRealmIndex ?? 7) &&
      (!c.requiredRoles || c.requiredRoles.includes(ctx.role)) &&
      (!c.requiredSects || c.requiredSects.includes(ctx.sect)) &&
      (!c.requiredPhysiques || c.requiredPhysiques.includes(ctx.physique)) &&
      (!c.requiredFlags || c.requiredFlags.every(flag => Object.hasOwn(ctx.flags,flag))) &&
      (!c.forbiddenFlags || c.forbiddenFlags.every(flag => !Object.hasOwn(ctx.flags,flag))) &&
      Object.entries(c.statThresholds || {}).every(([key,range]) => Number.isFinite(ctx.stats[key]) &&
        ctx.stats[key] >= (range.min ?? -Infinity) && ctx.stats[key] <= (range.max ?? Infinity)) &&
      (!c.custom || c.custom(ctx));
  }

  static weight(event,ctx) {
    return event.weightModifiers.reduce((weight,modifier) => weight *
      (modifier.condition(ctx) ? modifier.multiplier : 1),event.baseWeight);
  }

  static select(pool) {
    const ctx = this.context();
    const available = pool.filter(event => this.eligible(event,ctx) && this.weight(event,ctx) > 0);
    return available.length ? weightedPick(available,event => this.weight(event,ctx)) : null;
  }

  static note(event) {
    state.eventHistory[event.id] = {age:state.age,count:(state.eventHistory[event.id]?.count || 0) + 1};
  }

  static open() {
    const event = this.select(state.age <= 12 ? DIRECTOR_EVENTS.filter(entry => entry.category === 'CHILDHOOD') : DIRECTOR_EVENTS);
    if (!event) return false;
    this.note(event);
    state.pending = {type:'directed',id:event.id};
    return true;
  }
}

function directedEvent(id,category,conditions,render,options = {}) {
  return {id,category,conditions,render,baseWeight:options.baseWeight ?? 10,cooldownYears:options.cooldownYears ?? 12,
    oneTime:options.oneTime ?? true,weightModifiers:options.weightModifiers || [
      {label:'Cơ Duyên ≥ 75',condition:ctx => ctx.stats.luck >= 75 && category === 'EXPLORATION',multiplier:2},
      {label:'Dung Mạo ≥ 80',condition:ctx => ctx.stats.charm >= 80 && category === 'RELATIONSHIP',multiplier:1.8},
      {label:'Có đạo lữ',condition:ctx => Boolean(ctx.companion) && category === 'RELATIONSHIP',multiplier:1.5},
      {label:'Có từ 500 linh thạch',condition:ctx => ctx.inventory.stones >= 500 && category === 'EXPLORATION',multiplier:1.25},
      {label:'Nghiệp Lực ≤ −60',condition:ctx => ctx.stats.karma <= -60 && category === 'KARMA_CHAIN',multiplier:2},
      {label:'Thượng Cổ Bí Cảnh đang mở',condition:ctx => ctx.world === 'ancient' && category === 'EXPLORATION',multiplier:2}
    ]};
}

function legacyChoices(index) {
  const [label,intro,choices] = events[index];
  const options = choices.length === 2 ? [...choices,
    ['Quan sát từ xa','Ngươi giữ khoảng cách và ghi lại điều vừa thấy.',{insight:2}]] : choices;
  return [label,intro,options.map(([option,message,changes,cost],choice) => {
    const adjusted = scaleNarrative(changes);
    return linkChoice(option,adjusted.stones > 0 ? 'Có thể thu ' + number(adjusted.stones) + ' linh thạch.' : '',
      () => resolveEvent({index},choice,message,adjusted),state.stones >= (cost ?? Math.max(0,-(changes.stones || 0))) &&
      !(events[index][3]?.hook === 'family' && choice === 0 && state.family));
  }),true];
}

function scaleNarrative(changes) {
  const result = {...changes};
  if (result.stones > 0) result.stones = scaledStones(result.stones);
  if (result.qi > 0) result.qi = Math.ceil(result.qi * (1 + state.realm * .23));
  if (result.health < 0) result.health = Math.round(result.health * (1 + state.realm * .12));
  return result;
}

      quotaHerbs:'Dùng dược liệu trong túi để nộp chỉ tiêu',envoy:'Theo sư phụ dựng trận ngoài bí cảnh',
      verdict:'Chia phiên dẫn nước giữa hai phong',stele:'Đặt tay lên đường khắc',bowingHerbs:'Thu nhánh cỏ đang cúi ngọn',
      lightningRoot:'Dẫn lôi quang vào kinh mạch',rustBottle:'Rót linh lực vào bình rỉ',
      swordSpirit:'Để kiếm linh đáp lời Kiếm Si',beautyCalamity:'Mời chủ quán đứng làm chứng',
      arrayFlaw:'Dùng linh lực gỡ nét thừa',partnerJealousy:'Gọi đạo lữ đến nói rõ câu chuyện',
      masterSealed:'Giữ cửa đến khi đèn đổi màu',foxPath:'Gieo hạt giống linh hồ để lại'};
    const options = [
      rerender(dire ? 'Giữ tâm và chuẩn bị nghênh chiến' : firstActions[id] || 'Bước tới tìm hiểu',
        id === 'quotaHerbs' ? 'Tiêu hao một Tụ Khí Thảo · nhận công trạng.' : '',() => {
        state.pending = null;
        if (dire) startFight('ambush',label,Math.min(7,state.realm + 1));
        else {
          apply({qi:gain,insightPoints:2 + state.realm});
          if (id === 'quotaHerbs' && chargeMaterials(['khithao'])) apply({contribution:14 + state.rank * 3});
          if (id === 'graveScavenger') gainMaterial('huyenthiet');
          if (id === 'envoy') {state.cultivationRetreat = 1;apply({reputation:6 + state.rank});}
          if (id === 'verdict') {
            state.support[0] += 4;state.support[1] += 4;
            apply({reputation:12 + state.rank,karma:7});
          }
          if (id === 'stele') awakenBody();
          if (id === 'bowingHerbs') gainMaterial('tienchi');
          if (id === 'lightningRoot') apply({mana:Math.ceil(manaMax() * .5),qi:gain});
          if (id === 'rustBottle') learnArt('breath');
          if (id === 'swordSpirit') learnArt('intent');
          if (id === 'partnerJealousy') affinity(ctx.companion,12);
          if (id === 'masterSealed') affinity(ctx.master,11);
          if (id === 'foxPath') gainMaterial('banglien');
          note(label + ' · Cơ duyên giúp ngươi hiểu thêm một tầng tu hành.',category === 'LORE_PHYSIQUE' ? 'sacred' : 'good');
        }
      },id !== 'quotaHerbs' || owned('khithao') > 0),
      rerender('Mời người trong cuộc trình bày','',() => {
        state.pending = null;
        apply({karma:3 + state.realm,heart:5 + state.realm});
        note(label + ' · Hai bên giải được lời nghi ngờ.','good');
      }),
      rerender('Lùi lại và quan sát','',() => {
        state.pending = null;
        apply({insightPoints:1 + state.realm});
        note(label + ' · Ngươi ghi nhớ những dấu hiệu còn sót lại.');
      })
    ];
    return [label,formatLoreText(template,ctx),options,true];
  },{baseWeight:24}));
const DIRECTOR_EVENTS = [...legacyDirectorEvents,...episodeDirectorEvents,...authoredDirectorEvents];

function directedMenu(pending) {
  const event = DIRECTOR_EVENTS.find(entry => entry.id === pending.id);
  const ctx = EventDirector.context();
  const menu = event.render(ctx);
  const badge = {CHILDHOOD:'Xuất thân · ' + state.background,SECT_ROLE:'Thân phận · ' + ctx.roleName,
    EXPLORATION:'Cơ Duyên · ' + ctx.stats.luck,STAT_TRIGGER:'Ngộ Tính ' + ctx.stats.comprehension + ' · Dung Mạo ' + ctx.stats.charm,
    LORE_PHYSIQUE:'Huyết mạch · ' + ctx.physiqueName,RELATIONSHIP:'Nhân Mạch · ' + (ctx.companion?.name || ctx.master?.name || ctx.roleName),
    KARMA_CHAIN:'Nghiệp Lực · ' + ctx.stats.karma};
  const targetStat = cultivatorStats(ctx.rival || {name:'',realm:state.realm,insight:50,root:0});
  const extra = (label,hint,changes) => rerender(label,hint,() => {
    state.pending = null;
    state.sagaHistory.push({id:event.id,age:state.age,result:label});
    apply(changes);
    note(menu[0] + ' · ' + label + '.','good');
  });
  if (event.id === 'fallen' && state.karma <= -40) menu[2].push(rerender('Phá huyệt cổ, đoạt vật chôn',
    '[Ma Tính ≥ 40] · Đổi nghiệp lực lấy chiến lợi phẩm.',() => {
      state.pending = null;
      apply({stones:scaledStones(35),karma:-16});
      rewardMaterials(materialTier());
      recordCause('destroyedAncientTomb',3,50,'Người giữ huyệt năm ấy tìm thấy đường nứt dẫn về động phủ của ngươi.');
      note('Ngươi phá huyệt cổ và lấy khế sách chôn theo.','danger');
    }));
  if (event.category !== 'CHILDHOOD') {
    if (ctx.stats.comprehension >= 70) menu[2].push(extra('[Ngộ Tính Thượng Thừa] Nhìn thấu sơ hở','', {insightPoints:3 + state.realm,qi:Math.ceil(target() * .15)}));
    if (ctx.age >= 18 && ctx.stats.charm >= 85) menu[2].push(extra('[Tuyệt Thế Dung Mạo] Hóa giải căng thẳng','',{karma:5,heart:7}));
    if (ctx.stats.atk >= targetStat.atk * 1.3) menu[2].push(extra('[Lấy Lực Phá Xảo] Dùng uy áp','',{stones:scaledStones(12),karma:-5}));
    if (state.stones >= 500) menu[2].push(extra('[Tài Đại Khí Thô] Mua đứt cơ duyên','Tốn 500 linh thạch.',{stones:-500,qi:Math.ceil(target() * .25),manuals:1}));
    if (ctx.master && ctx.master.realm >= state.realm + 1) menu[2].push(extra('[Báo Danh Sư Phụ] Nhắc tên ' + ctx.master.name,'',{heart:7,luck:4}));
  }
  menu[1] = 'Duyên Cớ Kích Hoạt · ' + badge[event.category] + '. ' + formatLoreText(menu[1],ctx);
  const breakdown = textElement('details','','work-card');
  breakdown.append(textElement('summary','Xem trọng số chọn sự kiện'),
    textElement('p',EventDirector.weight(event,ctx).toLocaleString('vi-VN') + ' = ' + event.baseWeight + ' gốc' +
      event.weightModifiers.filter(modifier => modifier.condition(ctx))
        .map(modifier => ' × ' + modifier.multiplier.toLocaleString('vi-VN') + ' (' + modifier.label + ')').join('') +
      '. Trò chơi rút theo tỷ lệ trọng số giữa những sự kiện đủ điều kiện.'));
  if (menu[4]) breakdown.append(menu[4]);
  menu[4] = breakdown;
  return menu;
}

function textElement(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  return element;
}

function setBar(bar, value, max) {
  bar.setAttribute('aria-valuemin','0');
  bar.setAttribute('aria-valuemax',max);
  bar.setAttribute('aria-valuenow',value);
  bar.firstElementChild.style.width = max ? value / max * 100 + '%' : '100%';
}

for (const [key,icon,label,color] of attributes) {
  const wrapper = document.createElement('div');
  const heading = textElement('div',icon + ' ' + label,'stat-label');
  const value = textElement('b','');
  value.id = key + '-value';
  heading.append(value);
  const bar = textElement('div','','track');
  bar.id = key + '-track';
  bar.setAttribute('role','progressbar');
  bar.setAttribute('aria-label',label);
  bar.style.setProperty('--fill',color);
  bar.append(document.createElement('i'));
  wrapper.append(heading,bar);
  $('stats').append(wrapper);
}

// Cập nhật thêm các mục mới để trình đọc màn hình chỉ đọc phần vừa ghi.
function render() {
  document.querySelector('.game').classList.toggle('rolling',state.pending?.type === 'destiny' && !state.pending.revealed);
  $('year').textContent = 'Năm ' + (state.birth + state.age) + ' Lịch Đạo Giáo';
  $('portrait').innerHTML = portraitMarkup(state.appearance,state.sex,state.age,state.realm,lifespan(),activeGear('main'));
  $('name').textContent = state.name;
  $('realm').textContent = title();
  $('root').textContent = state.root;
  let badge = $('physique-badge');
  if (!badge) {
    badge = textElement('span','','destiny-badge');
    badge.id = 'physique-badge';
    $('root').after(badge);
  }
  badge.textContent = physiqueName();
  badge.dataset.grade = physiques[state.physique][1];
  $('wealth').textContent = number(state.stones) + ' Linh Thạch';
  $('life').textContent = 'Tuổi: ' + number(state.age) + ' / ' + number(lifespan());
  $('qi-value').textContent = target() ? number(state.qi) + ' / ' + number(target()) : 'Đã phi thăng';
  $('breakthrough').disabled = !unlocked();
  $('advance').disabled = Boolean(state.pending || state.dead);
  setBar($('qi-track'),target() ? state.qi : 100,target() || 100);
  $('mana-value').textContent = number(state.mana) + ' / ' + number(manaMax());
  setBar($('mana-track'),state.mana,manaMax());
  for (const [key] of attributes) {
    $(key + '-value').textContent = key === 'health' ? state.health + ' / ' + maxHealth() : state[key] + '%';
    setBar($(key + '-track'),state[key],key === 'health' ? maxHealth() : 100);
  }
  const journal = $('logs');
  for (const [index,group] of state.logs.entries()) {
    let record = journal.children[index];
    if (!record) {
      record = textElement('article','','record');
      record.append(textElement('h3','Tuổi ' + number(group.age) + ' · ' + group.title));
      journal.append(record);
    }
    for (const entry of group.entries.slice(record.childElementCount - 1)) {
      record.append(textElement('p',entry.message,entry.tone));
    }
  }
  $('chronicle').scrollTop = $('chronicle').scrollHeight;
  try { localStorage.setItem(saveKey,JSON.stringify(state)); } catch {}
}

function showSheet(label, intro, choices, required = false, content) {
  sheetRequired = required;
  $('close').hidden = required;
  $('sheet-title').textContent = label;
  const body = $('sheet-body');
  body.replaceChildren();
  if (intro) body.append(textElement('p',intro,'intro'));
  if (content) body.append(content);
  const list = textElement('div','','choices');
  for (const choice of choices) {
    const button = textElement('button',choice.label,'choice' + (choice.primary ? ' primary' : ''));
    if (choice.grade !== undefined) button.dataset.grade = choice.grade;
    button.disabled = Boolean(choice.disabled);
    if (choice.hint) button.append(textElement('small',choice.hint));
    button.addEventListener('click',choice.run);
    list.append(button);
  }
  body.append(list);
  const sheet = $('sheet');
  const wasOpen = sheet.open;
  if (!wasOpen) sheet.showModal();
  sheet.scrollTop = 0;
  if (wasOpen) (required ? list.querySelector('button:not(:disabled)') : $('close'))?.focus();
}

function showMenu(menu) {
  if (!state || state.pending || state.dead) return;
  activeMenu = menu;
  if (menu.startsWith('gift:')) {
    const npc = state.npcs.find(person => person.id === Number(menu.slice(5)) && !person.lost);
    if (npc) showSheet(...giftMenu(npc));
    else showMenu('bonds');
    return;
  }
  if (menu.startsWith('art:')) {
    const skill = skills[menu.slice(4)];
    if (skill && state.skillBook[skill.id]) showSheet(...artMenu(skill));
    else showMenu('skills');
    return;
  }
  if (menu.startsWith('refine:')) {
    const item = state.gear.find(entry => entry.id === Number(menu.slice(7)));
    if (item && Object.values(state.equipment).includes(item.id)) showSheet(...refineMenu(item));
    else showMenu('forge');
    return;
  }
  if (menu.startsWith('npc:')) {
    const npc = state.npcs.find(person => person.id === Number(menu.slice(4)) && !person.lost);
    if (npc) showSheet(...npcMenu(npc));
    else showMenu('bonds');
    return;
  }
  showSheet(...({
    profile:profileMenu,sect:sectMenu,bag:bagMenu,bonds:bondsMenu,fate:fateMenu,
    missions:missionMenu,pavilion:pavilionMenu,council:councilMenu,
    gear:gearMenu,alchemy:alchemyMenu,forge:forgeMenu,market:marketMenu,garden:gardenMenu,
    stats:statsMenu,skills:skillsMenu,skillPavilion:() => skillsMenu(true),
    physique:requestAwakening,cultivation:cultivationMenu,family:familyMenu
  }[menu]()));
}

function closeSheet() {
  sheetRequired = false;
  activeMenu = '';
  if ($('sheet').open) $('sheet').close();
}

function showMandatory() {
  activeMenu = '';
  if (state.dead) {
    const scroll = textElement('div','','scroll');
    scroll.append(textElement('p',state.name + ' · ' + title()),
      textElement('p','Hưởng thọ ' + number(state.age) + ' tuổi · Linh thạch còn lại: ' + number(state.stones)),
      textElement('strong','Dấu ấn một đời'));
    const list = document.createElement('ul');
    for (const item of state.achievements.length ? state.achievements : ['Một đời tu hành giữa nhân gian.']) {
      list.append(textElement('li',item));
    }
    scroll.append(list,summaryDetails());
    showSheet('Bia Mộ',state.dead + ' · Luân hồi mở ra một kiếp khác.',[
      {label:'Chuyển Thế Đầu Thai',primary:true,run:() => showCreation()}
    ],true,scroll);
    return;
  }
  const pending = state.pending;
  const special = {fight:fightMenu,saga:sagaMenu,sagaFollowup,worldStory:worldStoryMenu,
    directed:directedMenu,destiny:fateReveal,encounter:encounterMenu,causal:causalMenu,fightOutcome:fightOutcomeMenu,
    ascension:() => ascensionMenu(true)}[pending.type];
  if (special) {
    showSheet(...special(pending));
    return;
  }
  if (pending.type === 'alchemy') {
    showSheet(...furnaceStep(pending));
    return;
  }
  if (pending.type === 'followup') {
    showSheet(...followupMenu(pending));
    return;
  }
  if (pending.type === 'storm') {
    const count = pending.strike + ' / ' + pending.total;
    const main = activeGear('main');
    const pills = [];
    for (const id of ['heal','rebirth','return','foundation','guard','thunder']) {
      for (let grade = 1; grade <= 4; grade++) {
        const stock = state.pillStock[pillKey(id,grade)];
        if (stock) pills.push(graded(rerender('Dùng ' + formulas.find(entry => entry[0] === id)[1] + ' ×' + stock,
          quality[grade] + ' · Dùng trước khi chống đỡ.',() => consumePill(id,grade)),grade));
      }
    }
    showSheet('Thiên Lôi Độ Kiếp','Đạo lôi thứ ' + count + ' sắp giáng. Khí huyết: ' + state.health + ' / ' + maxHealth() +
      ' · Kháng thiên lôi: ' + Math.min(75,gearTotal('resist') + art('resist')) + '% · Hộ mạch còn ' + state.wardCharges + ' lượt.',[
      {label:'Vận công chống đỡ',hint:main ? gearName(main) + ' đã sẵn sàng hộ thân.' : 'Dựa vào khí huyết và cơ duyên.',run:() => takeLightning('guard')},
      {label:'Đốt Hộ Kiếp Phù ×' + state.ward,hint:'Giảm 19 sát thương đạo lôi này.',disabled:!state.ward,run:() => takeLightning('ward')},
      {label:'Uống Hồi Xuân Đan ×' + state.pills,hint:'Hồi 18 khí huyết và giảm 10 sát thương đạo lôi này.',disabled:!state.pills,run:() => takeLightning('pill')},
      ...pills
    ],true);
    return;
  }
  if (pending.type === 'auction') {
    const item = pending.weapon ? 'Hộ Sơn Kiếm' : 'Công pháp Huyền Tức';
    function settle(bid) {
      state.pending = null;
      if (!bid || (bid === 12 && die(1,100) > 55 + state.luck * .25)) {
        apply({stones:18});
        note('Ngươi rời bàn đấu giá và nhận lại tiền cọc.');
      } else {
        apply({stones:-bid,[pending.weapon ? 'weapon' : 'manuals']:1});
        note('Búa gõ xuống. Ngươi nhận ' + item + ' với giá ' + (18 + bid) + ' linh thạch.','good');
        achievement('Đấu giá thành công');
      }
      finish();
    }
    showSheet('Đấu Giá Hội',item + ' được đưa lên đài. Ngươi đã đặt cọc 18 linh thạch.',[
      {label:'Trả thêm 12 linh thạch',hint:'Có thể bị trả giá cao hơn · Hoàn cọc nếu thua.',disabled:state.stones < 12,run:() => settle(12)},
      {label:'Trả thêm 27 linh thạch',hint:'Giá mua ngay, tổng cộng 45 linh thạch.',disabled:state.stones < 27,run:() => settle(27)},
      {label:'Rút lui và lấy lại tiền cọc',run:() => settle(0)}
    ],true);
    return;
  }
  const [label,intro,choices] = events[pending.index];
  const options = choices.length === 2 ? [...choices,
    ['Giữ khoảng cách và quan sát','Ngươi quan sát từ xa, ghi lại mọi việc trước khi rời đi.',{insight:2}]] : choices;
  showSheet(label,intro,options.map(([option,message,changes,cost],index) => ({
    label:option,disabled:state.stones < (cost ?? Math.max(0,-(changes.stones || 0))) ||
      (events[pending.index][3]?.hook === 'family' && index === 0 && Boolean(state.family)),
    run:() => resolveEvent(pending,index,message,changes)
  })),true);
}

$('close').addEventListener('click',closeSheet);
$('sheet').addEventListener('cancel',event => {
  event.preventDefault();
  if (!sheetRequired) closeSheet();
});
$('advance').addEventListener('click',advanceYear);
$('qi-detail').addEventListener('click',() => showMenu('cultivation'));
$('breakthrough').addEventListener('click',breakthrough);
$('profile').addEventListener('click',() => showMenu('profile'));
document.querySelectorAll('[data-menu]').forEach(button => {
  button.addEventListener('click',() => showMenu(button.dataset.menu));
});
try { state = JSON.parse(localStorage.getItem(saveKey)); } catch {}
if (!state || !Array.isArray(state.logs)) {
  state = null;
  $('advance').disabled = true;
  $('breakthrough').disabled = true;
  showCreation();
} else {
  upgradeSave();
  finish();
}
</script>
</body>
</html>
